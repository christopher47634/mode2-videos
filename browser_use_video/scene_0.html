<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0a0a0a; font-family:'Noto Sans SC',sans-serif; overflow:hidden; position:relative; }

/* Grid background */
body::before { content:''; position:absolute; top:0; left:0; right:0; bottom:0; 
  background: repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px),
              repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px); }

/* Glow orbs */
.orb1 { position:absolute; top:10%; left:15%; width:300px; height:300px; background:radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%); filter:blur(60px); }
.orb2 { position:absolute; bottom:15%; right:10%; width:250px; height:250px; background:radial-gradient(circle, rgba(0,255,136,0.1), transparent 70%); filter:blur(50px); }

/* Content */
.content { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px; }

/* Browser icon */
.browser-icon { width:120px; height:120px; border:3px solid #00D4FF; border-radius:24px; display:flex; align-items:center; justify-content:center; margin-bottom:40px; 
  box-shadow:0 0 30px rgba(0,212,255,0.3); opacity:0; animation:scaleIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s forwards; }
.browser-icon::before { content:''; width:60px; height:60px; border:3px solid #00FF88; border-radius:50%; }
.browser-icon::after { content:''; position:absolute; width:30px; height:3px; background:#00D4FF; }

/* Title */
.title { font-size:96px; font-weight:900; color:#00D4FF; text-shadow:0 0 40px rgba(0,212,255,0.5); text-align:center; margin-bottom:20px;
  opacity:0; animation:glowIn 1.0s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
.subtitle { font-size:48px; font-weight:700; color:#00FF88; text-align:center; margin-bottom:40px;
  opacity:0; animation:fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards; }
.desc { font-size:36px; color:rgba(255,255,255,0.7); text-align:center; line-height:1.6;
  opacity:0; animation:fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.8s forwards; }

/* Animations */
@keyframes scaleIn { from { opacity:0; transform:scale(0.3); } to { opacity:1; transform:scale(1); } }
@keyframes glowIn { from { opacity:0; transform:scale(0.8); text-shadow:0 0 0 transparent; } to { opacity:1; transform:scale(1); text-shadow:0 0 40px rgba(0,212,255,0.5); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

/* Corner decorations */
.corner-tr { position:absolute; top:6%; right:6%; width:40px; height:40px; border-top:2px solid #00D4FF; border-right:2px solid #00D4FF; opacity:0; animation:scaleIn 0.6s 1.0s forwards; }
.corner-bl { position:absolute; bottom:6%; left:6%; width:40px; height:40px; border-bottom:2px solid #00FF88; border-left:2px solid #00FF88; opacity:0; animation:scaleIn 0.6s 1.2s forwards; }
</style>
</head><body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="content">
  <div class="browser-icon"></div>
  <div class="title">Browser Use</div>
  <div class="subtitle">让AI上网</div>
  <div class="desc">🌐 Make websites accessible for AI agents</div>
</div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
</body></html>
