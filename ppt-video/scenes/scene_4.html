<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 4 - 三个技能</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--cyan:#00D4FF;--orange:#FF6B35;--green:#18C98B;--red:#FF3B5C;--blue:#0088CC;--purple:#6B3FA0;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5);--silver:#C0C0C0; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.1}
.bg-orb-1{width:600px;height:600px;background:var(--orange);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--cyan);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:350px;height:350px;background:var(--green);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--cyan);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:25%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:40%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:55%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:70%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:85%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:95%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.12;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:100px 60px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--orange);box-shadow:0 0 20px var(--orange)}
.light-dot-2{bottom:12%;right:12%;width:8px;height:8px;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:72px;font-weight:bold;opacity:0;text-align:center;color:var(--text);margin-bottom:80px}
.skill-card{width:920px;border-radius:20px;padding:36px 40px;margin-bottom:36px;opacity:0;position:relative;overflow:hidden}
.skill-card::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none}
.skill-card-inner{display:flex;align-items:center;gap:28px}
.skill-icon{width:90px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:16px;flex-shrink:0;font-size:42px;font-weight:bold}
.skill-info{flex:1}
.skill-name{font-size:32px;font-weight:bold;margin-bottom:6px;font-family:monospace}
.skill-desc{font-size:30px;color:var(--text-dim)}
.skill-num{font-size:52px;font-weight:bold;opacity:0.15;position:absolute;right:30px;top:50%;transform:translateY(-50%)}
.card-1{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.3)}
.card-1::before{border:1px solid rgba(0,212,255,0.15);border-radius:20px}
.card-1 .skill-icon{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.4);color:var(--cyan)}
.card-1 .skill-name{color:var(--cyan)}
.card-1 .skill-num{color:var(--cyan)}
.card-2{background:rgba(24,201,139,0.08);border:1px solid rgba(24,201,139,0.3)}
.card-2::before{border:1px solid rgba(24,201,139,0.15);border-radius:20px}
.card-2 .skill-icon{background:rgba(24,201,139,0.15);border:1px solid rgba(24,201,139,0.4);color:var(--green)}
.card-2 .skill-name{color:var(--green)}
.card-2 .skill-num{color:var(--green)}
.card-3{background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.3)}
.card-3::before{border:1px solid rgba(255,107,53,0.15);border-radius:20px}
.card-3 .skill-icon{background:rgba(255,107,53,0.15);border:1px solid rgba(255,107,53,0.4);color:var(--orange)}
.card-3 .skill-name{color:var(--orange)}
.card-3 .skill-num{color:var(--orange)}
.bottom-text{font-size:44px;font-weight:bold;opacity:0;text-align:center;color:var(--text-dim);margin-top:20px}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">三个独立技能</div>
  <div class="skill-card card-1" data-el="card1">
    <div class="skill-card-inner">
      <div class="skill-icon">🎨</div>
      <div class="skill-info">
        <div class="skill-name">GordenImagePPTGen</div>
        <div class="skill-desc">GPT直接生成豪华图片PPT</div>
      </div>
    </div>
    <div class="skill-num">01</div>
  </div>
  <div class="skill-card card-2" data-el="card2">
    <div class="skill-card-inner">
      <div class="skill-icon">🔄</div>
      <div class="skill-info">
        <div class="skill-name">GordenImage2PPTX</div>
        <div class="skill-desc">图片PPT转可编辑PPTX</div>
      </div>
    </div>
    <div class="skill-num">02</div>
  </div>
  <div class="skill-card card-3" data-el="card3">
    <div class="skill-card-inner">
      <div class="skill-icon">⚡</div>
      <div class="skill-info">
        <div class="skill-name">GordenSuperPPTSkill</div>
        <div class="skill-desc">一键串联，全自动流程</div>
      </div>
    </div>
    <div class="skill-num">03</div>
  </div>
  <div class="bottom-text" data-el="bottom">按需选用，灵活组合</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:14});
    reveal(document.querySelector('[data-el="card1"]'),t,{start:0.9,duration:0.6,x:-60,y:0,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="card2"]'),t,{start:1.8,duration:0.6,x:-60,y:0,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="card3"]'),t,{start:2.7,duration:0.6,x:-60,y:0,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="bottom"]'),t,{start:4.0,duration:0.7,y:30,blur:10});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.54;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.54));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
