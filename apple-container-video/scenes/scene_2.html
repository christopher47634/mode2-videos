<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'InterDisplay';
  src: url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');
  font-weight: bold; font-style: normal;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc');
  font-weight: bold;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: #06101F; font-family: 'NotoSansCJK', sans-serif;
}
.scene {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: #06101F;
}
.bg-orbs { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0; }
.orb-1 { width:500px; height:500px; top:200px; left:100px; background:radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%); }
.orb-2 { width:450px; height:450px; top:700px; right:-100px; background:radial-gradient(circle, rgba(52,199,89,0.1), transparent 70%); }
.orb-3 { width:350px; height:350px; top:1100px; left:200px; background:radial-gradient(circle, rgba(162,170,173,0.06), transparent 70%); }
.scanlines { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0;
  background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px); }
.scan-beam { position:absolute; left:0; width:100%; height:200px;
  background:linear-gradient(180deg, transparent, rgba(0,212,255,0.04), transparent);
  top:-200px; pointer-events:none; z-index:1; }

.content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:0 80px; }
.title { font-family:'InterDisplay','NotoSansCJK',sans-serif; font-size:76px; color:#A2AAAD; text-align:center; opacity:0;
  text-shadow:0 0 40px rgba(0,212,255,0.2); margin-bottom:100px; }
.icon-row { display:flex; align-items:center; justify-content:center; gap:100px; width:100%; }
.icon-item { display:flex; flex-direction:column; align-items:center; gap:30px; opacity:0; }
.icon-emoji { font-size:120px; }
.icon-label { font-family:'NotoSansCJK',sans-serif; font-size:36px; color:#00D4FF; }
.mid-text { font-family:'NotoSansCJK',sans-serif; font-size:44px; color:#A2AAAD; text-align:center;
  margin-top:100px; opacity:0; line-height:1.6; padding:30px 50px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(0,212,255,0.1);
  border-radius:16px; backdrop-filter:blur(20px); }
.connect-line { position:absolute; top:50%; left:50%; width:0; height:3px;
  background:linear-gradient(90deg, #00D4FF, #34C759); transform:translate(-50%,-50%);
  opacity:0; z-index:3; border-radius:2px; }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-orbs">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>
  </div>
  <div class="scanlines" id="scanlines"></div>
  <div class="scan-beam" id="scanBeam"></div>
  <div class="connect-line" id="connectLine"></div>
  <div class="content">
    <div class="title" id="title">Swift · Apple Silicon</div>
    <div class="icon-row">
      <div class="icon-item" id="iconLeft">
        <div class="icon-emoji">🐦</div>
        <div class="icon-label">Swift</div>
      </div>
      <div class="icon-item" id="iconRight">
        <div class="icon-emoji">⚡</div>
        <div class="icon-label">Apple Silicon</div>
      </div>
    </div>
    <div class="mid-text" id="midText">跑Linux容器像开虚拟机一样轻</div>
  </div>
</div>

<script>
window.__mode2Duration = 6.33;
window.__mode2Ready = true;

function progress(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return Math.max(0, Math.min(1, (t - start) / dur));
}
function mix(a, b, t) { return a + (b - a) * t; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function seekTo(t) {
  // 背景
  var op = easeOutQuart(progress(t, 0, 0.8));
  document.getElementById('orb1').style.opacity = op * 0.5;
  document.getElementById('orb1').style.transform = 'translate(' + Math.sin(t*0.3)*30 + 'px,' + Math.cos(t*0.2)*20 + 'px)';
  document.getElementById('orb2').style.opacity = op * 0.4;
  document.getElementById('orb2').style.transform = 'translate(' + Math.cos(t*0.25)*25 + 'px,' + Math.sin(t*0.35)*15 + 'px)';
  document.getElementById('orb3').style.opacity = op * 0.3;
  document.getElementById('orb3').style.transform = 'translate(' + Math.sin(t*0.4)*20 + 'px,' + Math.cos(t*0.15)*25 + 'px)';
  document.getElementById('scanlines').style.opacity = op * 0.5;
  var beamY = ((t*200) % 2200) - 200;
  document.getElementById('scanBeam').style.transform = 'translateY(' + beamY + 'px)';
  document.getElementById('scanBeam').style.opacity = 0.6;

  // 标题
  var titleP = easeOutQuart(progress(t, 0.3, 1.0));
  var titleEl = document.getElementById('title');
  titleEl.style.opacity = titleP;
  titleEl.style.transform = 'translateY(' + mix(40,0,titleP) + 'px)';

  // 左侧Swift图标旋转入场
  var leftP = easeOutQuart(progress(t, 1.0, 1.0));
  var leftEl = document.getElementById('iconLeft');
  leftEl.style.opacity = leftP;
  leftEl.style.transform = 'translateX(' + mix(-300,0,leftP) + 'px) rotate(' + mix(-180,0,leftP) + 'deg) scale(' + mix(0.3,1,leftP) + ')';

  // 右侧芯片图标旋转入场
  var rightP = easeOutQuart(progress(t, 1.3, 1.0));
  var rightEl = document.getElementById('iconRight');
  rightEl.style.opacity = rightP;
  rightEl.style.transform = 'translateX(' + mix(300,0,rightP) + 'px) rotate(' + mix(180,0,rightP) + 'deg) scale(' + mix(0.3,1,rightP) + ')';

  // 连接线
  var lineP = easeOutCubic(progress(t, 2.5, 1.0));
  document.getElementById('connectLine').style.opacity = lineP * 0.5;
  document.getElementById('connectLine').style.width = (lineP * 200) + 'px';

  // 中部文字淡入
  var midP = easeOutQuart(progress(t, 3.5, 1.2));
  var midEl = document.getElementById('midText');
  midEl.style.opacity = midP;
  midEl.style.transform = 'translateY(' + mix(50,0,midP) + 'px) scale(' + mix(0.95,1,midP) + ')';
}
seekTo(0);
</script>
</body>
</html>
