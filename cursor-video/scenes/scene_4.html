<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 4 - AI取代程序员？</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--cyan:#00D4FF;--purple:#8B5CF6;--red:#FF3B5C;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.12}
.bg-orb-1{width:600px;height:600px;background:var(--red);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--purple);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:350px;height:350px;background:var(--red);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--red);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:25%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:40%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:55%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:70%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:85%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:95%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:0.15;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 80px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--red);border-left:2px solid var(--red)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--red);border-right:2px solid var(--red)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--red);box-shadow:0 0 20px var(--red)}
.light-dot-2{bottom:12%;right:12%;width:8px;height:8px;background:var(--red);box-shadow:0 0 20px var(--red)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:72px;font-weight:bold;opacity:0;text-align:center;color:var(--red);margin-bottom:80px;text-shadow:0 0 40px rgba(255,59,92,0.4)}
.warn-icon{font-size:50px;margin-bottom:20px;display:block}
.card{width:880px;border-radius:20px;padding:36px 44px;margin-bottom:30px;opacity:0;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;border:1px solid rgba(255,59,92,0.3);pointer-events:none}
.card-inner{display:flex;align-items:center;gap:24px}
.card-icon{font-size:48px;width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);flex-shrink:0}
.card-text{flex:1}
.card-title{font-size:36px;font-weight:bold;color:var(--text);margin-bottom:6px}
.card-desc{font-size:26px;color:var(--text-dim)}
.card-bg{position:absolute;top:0;right:0;width:200px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,59,92,0.05))}
.card-creative{background:rgba(139,92,246,0.06)}
.card-creative::before{border-color:rgba(139,92,246,0.3)}
.card-creative .card-icon{background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.3)}
.punchline{font-size:40px;font-weight:bold;opacity:0;text-align:center;color:var(--text-dim);margin-top:50px;letter-spacing:2px}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">⚠️ AI取代程序员？</div>
  <div class="card" data-el="card1">
    <div class="card-bg"></div>
    <div class="card-inner">
      <div class="card-icon">📉</div>
      <div class="card-text">
        <div class="card-title">初级岗位减少</div>
        <div class="card-desc">重复性编码工作正在被AI替代</div>
      </div>
    </div>
  </div>
  <div class="card" data-el="card2">
    <div class="card-bg"></div>
    <div class="card-inner">
      <div class="card-icon">💾</div>
      <div class="card-text">
        <div class="card-title">代码不再稀缺</div>
        <div class="card-desc">AI让代码生成成本趋近于零</div>
      </div>
    </div>
  </div>
  <div class="card card-creative" data-el="card3">
    <div class="card-bg"></div>
    <div class="card-inner">
      <div class="card-icon">💡</div>
      <div class="card-text">
        <div class="card-title">但创造力不可替代</div>
        <div class="card-desc">架构设计、产品思维、创新才是核心</div>
      </div>
    </div>
  </div>
  <div class="punchline" data-el="punch">这不是危言耸听</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:14});
    reveal(document.querySelector('[data-el="card1"]'),t,{start:1.2,duration:0.6,y:50,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="card2"]'),t,{start:2.4,duration:0.6,y:50,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="card3"]'),t,{start:3.6,duration:0.6,y:50,scale:0.95,blur:12});
    reveal(document.querySelector('[data-el="punch"]'),t,{start:5.0,duration:0.6,y:30,blur:10});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.13;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.13));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
