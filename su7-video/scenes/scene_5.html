<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 5 - 中国品牌 打破纪录</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--orange:#FF6900;--red:#E63946;--cyan:#00D4FF;--green:#10B981;--gold:#FFD700;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.12}
.bg-orb-1{width:650px;height:650px;background:var(--gold);top:-200px;left:-200px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:500px;height:500px;background:var(--green);bottom:-150px;right:-150px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:400px;height:400px;background:var(--gold);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:25%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:40%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:55%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:70%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:85%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:95%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0.12;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 80px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--gold);box-shadow:0 0 20px var(--gold)}
.light-dot-2{bottom:12%;right:12%;width:8px;height:8px;background:var(--green);box-shadow:0 0 20px var(--green)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:64px;font-weight:bold;opacity:0;text-align:center;color:var(--gold);margin-bottom:60px;text-shadow:0 0 40px rgba(255,215,0,0.4)}
.big-statement{font-size:80px;font-weight:bold;opacity:0;text-align:center;background:linear-gradient(135deg,var(--green),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:80px;line-height:1.3}
.data-row{display:flex;gap:40px;width:100%;margin-bottom:60px}
.data-item{flex:1;text-align:center;opacity:0;border-radius:16px;padding:30px 20px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2)}
.data-num{font-size:56px;font-weight:bold;color:var(--green)}
.data-label{font-size:24px;color:var(--text-dim);margin-top:8px}
.footer-text{font-size:36px;opacity:0;text-align:center;color:var(--text-dim)}
.footer-text .accent{color:var(--orange)}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">🇨🇳 中国品牌 打破纪录</div>
  <div class="big-statement" data-el="statement">保时捷Taycan<br>被超越</div>
  <div class="data-row">
    <div class="data-item" data-el="d1">
      <div class="data-num">6:46</div>
      <div class="data-label">小米SU7 Ultra</div>
    </div>
    <div class="data-item" data-el="d2">
      <div class="data-num">7:07</div>
      <div class="data-label">保时捷 Taycan</div>
    </div>
  </div>
  <div class="footer-text" data-el="footer">数据说话 <span class="accent">实力证明</span></div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:14});
    reveal(document.querySelector('[data-el="statement"]'),t,{start:1.0,duration:0.8,y:50,scale:0.94,blur:16});
    reveal(document.querySelector('[data-el="d1"]'),t,{start:2.2,duration:0.5,y:40,scale:0.95,blur:10});
    reveal(document.querySelector('[data-el="d2"]'),t,{start:2.8,duration:0.5,y:40,scale:0.95,blur:10});
    reveal(document.querySelector('[data-el="footer"]'),t,{start:3.5,duration:0.6,y:30,blur:10});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=4.64;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,4.64));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
