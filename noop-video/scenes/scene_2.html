<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - noop的解法</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--cyan:#00D4FF;--green:#18C98B;--red:#FF3B5C;--blue:#0088CC;--purple:#6B3FA0;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.1}
.bg-orb-1{width:600px;height:600px;background:#0a4030;top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:#0a3040;bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:350px;height:350px;background:var(--green);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--green);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:8%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:22%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:38%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:52%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:68%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:82%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:92%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0.12;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 80px 180px 80px;height:100%}
.corner{position:absolute;width:50px;height:50px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--green);border-left:2px solid var(--green)}
.corner-br{bottom:240px;right:60px;border-bottom:2px solid var(--green);border-right:2px solid var(--green)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--green);box-shadow:0 0 20px var(--green)}
.light-dot-2{bottom:22%;right:12%;width:8px;height:8px;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Scene 2 specific */
.scene-title {
  font-size: 64px; font-weight: bold; opacity: 0;
  color: var(--green);
  margin-bottom: 80px;
  text-align: center;
  text-shadow: 0 0 40px rgba(24,201,139,0.4);
}
.flow-container {
  display: flex; flex-direction: column; align-items: center;
  gap: 40px; width: 880px;
}
.flow-step {
  background: rgba(10,30,20,0.6);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(24,201,139,0.2);
  border-radius: 24px;
  padding: 40px 48px;
  display: flex; align-items: center; gap: 30px;
  opacity: 0; width: 100%;
  position: relative; overflow: hidden;
}
.flow-step::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, rgba(24,201,139,0.3), transparent);
}
.flow-icon {
  font-size: 64px; min-width: 80px; text-align: center;
}
.flow-text { flex: 1; }
.flow-label {
  font-size: 36px; font-weight: bold; color: var(--green);
  margin-bottom: 8px;
}
.flow-desc {
  font-size: 28px; color: var(--text-dim);
}
.flow-arrow {
  font-size: 48px; color: var(--green); opacity: 0;
  text-align: center;
}
.cloud-blocked {
  position: relative;
  display: inline-block;
}
.cloud-x {
  position: absolute; top: -10px; right: -10px;
  font-size: 36px; color: var(--red);
  text-shadow: 0 0 15px rgba(255,59,92,0.6);
}
.flow-badge {
  opacity: 0; margin-top: 20px;
  background: rgba(24,201,139,0.1);
  border: 1px solid rgba(24,201,139,0.3);
  border-radius: 50px;
  padding: 18px 48px;
  font-size: 32px; color: var(--green);
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="scene-title" data-el="title">noop说不用了</div>
  <div class="flow-container">
    <div class="flow-step" data-el="step1">
      <div class="flow-icon">📡</div>
      <div class="flow-text">
        <div class="flow-label">蓝牙直连手环</div>
        <div class="flow-desc">WHOOP 4.0 & 5.0 兼容</div>
      </div>
    </div>
    <div class="flow-arrow" data-el="arrow1">↓</div>
    <div class="flow-step" data-el="step2">
      <div class="flow-icon">💾</div>
      <div class="flow-text">
        <div class="flow-label">数据存入本地SQLite</div>
        <div class="flow-desc">你的设备，你的数据库</div>
      </div>
    </div>
    <div class="flow-arrow" data-el="arrow2">↓</div>
    <div class="flow-step" data-el="step3">
      <div class="flow-icon">
        <span class="cloud-blocked">
          ☁️<span class="cloud-x">✕</span>
        </span>
      </div>
      <div class="flow-text">
        <div class="flow-label" style="color:var(--text-dim);text-decoration:line-through">不经过云端</div>
        <div class="flow-desc">零数据泄露 · 零依赖</div>
      </div>
    </div>
    <div class="flow-badge" data-el="badge">🔒 本地优先 Local-first</div>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:12});
    reveal(document.querySelector('[data-el="step1"]'),t,{start:0.8,duration:0.6,y:30,blur:8});
    reveal(document.querySelector('[data-el="arrow1"]'),t,{start:1.6,duration:0.3,y:10,blur:4,scale:1});
    reveal(document.querySelector('[data-el="step2"]'),t,{start:2.2,duration:0.6,y:30,blur:8});
    reveal(document.querySelector('[data-el="arrow2"]'),t,{start:3.2,duration:0.3,y:10,blur:4,scale:1});
    reveal(document.querySelector('[data-el="step3"]'),t,{start:3.8,duration:0.6,y:30,blur:8});
    reveal(document.querySelector('[data-el="badge"]'),t,{start:4.8,duration:0.5,y:20,blur:6,scale:1});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.46;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.46));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
