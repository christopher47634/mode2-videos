<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 1 - ds4 项目介绍</title>
<style>
@font-face {
  font-family: 'LXGW WenKai';
  src: url('file:///mnt/e/Fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'LXGW WenKai';
  src: url('file:///mnt/e/Fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///mnt/e/Fonts/InterVariable.ttf') format('truetype');
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'LXGW WenKai', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 600px; height: 600px; background: var(--blue);
  top: -150px; left: -150px;
  animation: orbFloat1 20s ease-in-out infinite;
}
.bg-orb-2 {
  width: 450px; height: 450px; background: var(--purple);
  bottom: -100px; right: -100px;
  animation: orbFloat2 25s ease-in-out infinite;
}
.bg-orb-3 {
  width: 350px; height: 350px; background: var(--cyan);
  top: 45%; left: 50%; transform: translate(-50%, -50%);
  animation: orbFloat3 18s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(120px,80px); }
  66% { transform: translate(-60px,150px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,-60px); }
  66% { transform: translate(50px,-120px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.3); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 8%; animation-duration: 14s; animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 12s; animation-delay: 4s; }
.particle:nth-child(4) { left: 52%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 68%; animation-duration: 13s; animation-delay: 3s; }
.particle:nth-child(6) { left: 82%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(7) { left: 92%; animation-duration: 11s; animation-delay: 7s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 100px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2;
  opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

/* === Floating Light Points === */
.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 12%; left: 8%; width: 6px; height: 6px;
  background: var(--cyan); box-shadow: 0 0 20px var(--cyan);
}
.light-dot-2 {
  bottom: 22%; right: 12%; width: 8px; height: 8px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}

/* === Glass Card === */
.glass-card {
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 24px;
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}

/* === Section Header === */
.section-label {
  font-family: 'Inter', sans-serif;
  font-size: 28px; font-weight: 600;
  color: var(--cyan);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-bottom: 40px;
  opacity: 0;
}

/* === GitHub Screenshot Frame === */
.screenshot-frame {
  width: 900px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(0,212,255,0.15);
  box-shadow: 0 20px 80px rgba(0,0,0,0.5), 0 0 60px rgba(0,212,255,0.08);
  position: relative;
  opacity: 0;
}
.screenshot-frame img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  object-position: top center;
  max-height: 500px;
}
.screenshot-frame::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(transparent, var(--bg));
  pointer-events: none;
}
.browser-bar {
  height: 44px;
  background: rgba(13,17,23,0.95);
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.browser-dot {
  width: 12px; height: 12px; border-radius: 50%;
}
.browser-dot.r { background: #FF5F56; }
.browser-dot.y { background: #FFBD2E; }
.browser-dot.g { background: #27C93F; }
.browser-url {
  flex: 1; margin-left: 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px; padding: 6px 16px;
  font-size: 18px; color: var(--text-dim);
  font-family: 'Inter', monospace;
}

/* === Project Info === */
.project-info {
  text-align: center;
  margin-top: 48px;
  opacity: 0;
}
.project-name {
  font-size: 120px;
  font-weight: bold;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #6B3FA0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 8px;
  line-height: 1.1;
}
.project-author {
  font-size: 36px;
  color: var(--text-dim);
  margin-top: 16px;
  font-family: 'Inter', sans-serif;
}
.project-author span {
  color: var(--cyan);
}

/* === Badge Row === */
.badge-row {
  display: flex; gap: 20px; justify-content: center;
  margin-top: 36px;
  opacity: 0;
}
.badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 40px;
  padding: 14px 28px;
  font-size: 28px; font-weight: 600;
}
.badge .icon { font-size: 24px; }
.badge-stars { color: #FFD700; }
.badge-lang { color: var(--cyan); }

/* === Description === */
.description {
  margin-top: 40px;
  font-size: 42px;
  color: var(--text);
  text-align: center;
  line-height: 1.6;
  opacity: 0;
}
.description .highlight {
  color: var(--cyan);
  font-weight: bold;
}
.description .gold {
  color: #FFD700;
}

/* === Animation Classes === */
.anim-fade-up {
  opacity: 0; transform: translateY(40px);
  transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
}
.anim-fade-up.show { opacity: 1; transform: translateY(0); }

.anim-scale-in {
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.34,1.56,0.64,1);
}
.anim-scale-in.show { opacity: 1; transform: scale(1); }

.anim-slide-up {
  opacity: 0; transform: translateY(60px);
  transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
}
.anim-slide-up.show { opacity: 1; transform: translateY(0); }

.anim-glow-pulse {
  animation: glowPulse 2.5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { filter: drop-shadow(0 0 8px rgba(0,212,255,0.3)); }
  50% { filter: drop-shadow(0 0 20px rgba(0,212,255,0.6)); }
}

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<!-- L-Corner Decorations -->
<div class="corner corner-tl anim-scale-in" data-delay="0.3"></div>
<div class="corner corner-br anim-scale-in" data-delay="0.5"></div>

<!-- Floating Light Points -->
<div class="light-dot light-dot-1 anim-scale-in" data-delay="0.4" style="animation: float 3s ease-in-out infinite;"></div>
<div class="light-dot light-dot-2 anim-scale-in" data-delay="0.6" style="animation: float 4s ease-in-out infinite reverse;"></div>

<!-- Content -->
<div class="content">
  <div class="section-label anim-fade-up" data-delay="0.2">GITHUB · TRENDING</div>

  <!-- GitHub Screenshot -->
  <div class="screenshot-frame anim-slide-up" data-delay="0.4">
    <div class="browser-bar">
      <div class="browser-dot r"></div>
      <div class="browser-dot y"></div>
      <div class="browser-dot g"></div>
      <div class="browser-url">github.com/antirez/ds4</div>
    </div>
    <img src="github_screenshot.png" alt="GitHub ds4 repository">
  </div>

  <!-- Project Info -->
  <div class="project-info anim-fade-up" data-delay="1.0">
    <div class="project-name">ds4</div>
    <div class="project-author">by <span>antirez</span></div>
  </div>

  <!-- Badges -->
  <div class="badge-row anim-scale-in" data-delay="1.4">
    <div class="badge badge-stars">
      <span class="icon">★</span>
      <span>13K Stars</span>
    </div>
    <div class="badge badge-lang">
      <span class="icon">◆</span>
      <span>C Language</span>
    </div>
  </div>

  <!-- Description -->
  <div class="description anim-fade-up" data-delay="1.8">
    <span class="highlight">Redis之父</span>新作<br>
    五周拿下 <span class="gold">一万三千星</span>
  </div>
</div>

<script>
window.__mode2Ready = true;

function seekTo(t) {
  // Reset all animations
  document.querySelectorAll('[data-delay]').forEach(el => {
    const delay = parseFloat(el.dataset.delay);
    if (t >= delay) {
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  });

  // Floating lights always visible after their delay
  document.querySelectorAll('.light-dot').forEach(el => {
    const delay = parseFloat(el.dataset.delay);
    if (t >= delay) el.style.opacity = '1';
    else el.style.opacity = '0';
  });

  // Corners always visible after their delay
  document.querySelectorAll('.corner').forEach(el => {
    const delay = parseFloat(el.dataset.delay);
    if (t >= delay) el.style.opacity = '1';
    else el.style.opacity = '0';
  });
}

// Auto-run for preview
// Auto-run for preview (stops when seekTo is called externally)
let startTime = performance.now();
let autoRun = true;
let _origSeekTo = seekTo;
window.seekTo = function(t) {
  autoRun = false;
  _origSeekTo(t);
};
function animateElements() {
  if (!autoRun) return;
  const elapsed = (performance.now() - startTime) / 1000;
  _origSeekTo(elapsed);
  requestAnimationFrame(animateElements);
}
animateElements();
</script>
</body>
</html>
