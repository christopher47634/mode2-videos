<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'InterDisplay';src:url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');font-weight:bold;font-style:normal;}
@font-face{font-family:'Inter';src:url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');font-weight:bold;font-style:normal;}
@font-face{font-family:'NotoSansCJK';src:url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');font-weight:bold;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;background:#1A1B26;overflow:hidden;position:relative;}
.bg-glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.3;pointer-events:none;}
.glow1{width:600px;height:600px;background:#7AA2F7;top:300px;left:250px;}
.glow2{width:500px;height:500px;background:#BB9AF7;bottom:200px;right:200px;}
.scanline{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(122,162,247,0.03) 4px,rgba(122,162,247,0.03) 5px);pointer-events:none;z-index:1;}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;}
.title{position:absolute;top:250px;width:100%;text-align:center;font-family:'InterDisplay','NotoSansCJK',sans-serif;font-size:84px;color:#7AA2F7;}
.center-icon{position:absolute;top:500px;left:50%;transform:translateX(-50%);width:240px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.center-ext{font-family:'Inter',monospace;font-size:48px;color:#9ECE6A;font-weight:bold;}
/* Tags positioned individually with absolute positioning */
.tag{position:absolute;padding:18px 36px;border-radius:20px;font-family:'NotoSansCJK','Inter',sans-serif;font-size:36px;white-space:nowrap;}
#tag0{top:900px;left:120px;background:rgba(158,206,106,0.15);color:#9ECE6A;}
#tag1{top:900px;right:120px;background:rgba(122,162,247,0.15);color:#7AA2F7;}
#tag2{top:1050px;left:180px;background:rgba(224,175,104,0.15);color:#E0AF68;}
#tag3{top:1050px;right:180px;background:rgba(187,154,247,0.15);color:#BB9AF7;}
</style>
</head><body>
<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="scanline"></div>
<div id="title" class="title">一个HTML搞定一切</div>
<div id="centerIcon" class="center-icon glass">
  <div class="center-ext">.html</div>
</div>
<div id="tag0" class="tag" style="opacity:0;">零依赖</div>
<div id="tag1" class="tag" style="opacity:0;">跨平台</div>
<div id="tag2" class="tag" style="opacity:0;">离线可用</div>
<div id="tag3" class="tag" style="opacity:0;">一键分享</div>
<script>
window.__mode2Duration=4.47;
function seekTo(t){
  var title=document.getElementById('title');
  var centerIcon=document.getElementById('centerIcon');
  // Title 0-0.7
  var tp=Math.min(Math.max(t/0.7,0),1);
  title.style.opacity=tp;
  title.style.transform='translateY('+(50-50*tp)+'px)';
  // Center icon: pop 0.5-1.5
  var cp=Math.min(Math.max((t-0.5)/1.0,0),1);
  var scale=0.2+0.8*cp;
  centerIcon.style.transform='translateX(-50%) scale('+scale+')';
  centerIcon.style.opacity=cp;
  // Tags fade in one by one
  for(var i=0;i<4;i++){
    var tag=document.getElementById('tag'+i);
    var startT=1.8+i*0.4;
    var ip=Math.min(Math.max((t-startT)/0.5,0),1);
    tag.style.opacity=ip;
    tag.style.transform='translateY('+(30-30*ip)+'px)';
  }
}
window.__mode2Ready=true;
seekTo(0);
</script>
</body></html>
