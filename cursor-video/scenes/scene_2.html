<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - 不是补全，是理解</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--cyan:#00D4FF;--purple:#8B5CF6;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.1}
.bg-orb-1{width:600px;height:600px;background:var(--purple);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--cyan);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:350px;height:350px;background:var(--purple);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--purple);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:25%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:40%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:55%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:70%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:85%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:95%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),transparent);opacity:0.12;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 80px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--purple);border-left:2px solid var(--purple)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--purple);border-right:2px solid var(--purple)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--purple);box-shadow:0 0 20px var(--purple)}
.light-dot-2{bottom:12%;right:12%;width:8px;height:8px;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:68px;font-weight:bold;opacity:0;text-align:center;color:var(--text);margin-bottom:80px}
.title span{background:linear-gradient(135deg,var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.editor-mock{width:880px;border-radius:16px;background:rgba(15,23,42,0.9);border:1px solid rgba(139,92,246,0.3);overflow:hidden;opacity:0;position:relative}
.editor-bar{display:flex;align-items:center;gap:8px;padding:16px 24px;background:rgba(139,92,246,0.1);border-bottom:1px solid rgba(139,92,246,0.2)}
.editor-dot{width:12px;height:12px;border-radius:50%}
.dot-r{background:#FF5F56}.dot-y{background:#FFBD2E}.dot-g{background:#27C93F}
.editor-tab{margin-left:20px;font-size:22px;color:var(--text-dim)}
.editor-body{padding:30px;font-family:monospace;font-size:24px;line-height:1.8;color:var(--text-dim)}
.code-line{margin-bottom:4px}
.code-keyword{color:#C084FC}.code-func{color:#60A5FA}.code-str{color:#34D399}.code-cmt{color:#475569;font-style:italic}
.arrow-area{display:flex;align-items:center;gap:20px;margin-top:50px;opacity:0}
.arrow-down{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:30px solid var(--purple);filter:drop-shadow(0 0 10px var(--purple))}
.arrow-label{font-size:36px;font-weight:bold;color:var(--cyan);letter-spacing:2px}
.tagline{font-size:42px;font-weight:bold;opacity:0;text-align:center;color:var(--purple);margin-top:50px;text-shadow:0 0 40px rgba(139,92,246,0.4)}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">不是补全，是<span>理解</span></div>
  <div class="editor-mock" data-el="editor">
    <div class="editor-bar">
      <div class="editor-dot dot-r"></div><div class="editor-dot dot-y"></div><div class="editor-dot dot-g"></div>
      <div class="editor-tab">main.py — Cursor</div>
    </div>
    <div class="editor-body">
      <div class="code-line"><span class="code-cmt"># Cursor 正在分析你的项目...</span></div>
      <div class="code-line"><span class="code-keyword">class</span> <span class="code-func">UserService</span>:</div>
      <div class="code-line">  <span class="code-keyword">def</span> <span class="code-func">authenticate</span>(self, user):</div>
      <div class="code-line">    <span class="code-cmt"># AI理解了整个项目结构</span></div>
      <div class="code-line">    <span class="code-cmt"># 知道数据库、中间件、路由</span></div>
      <div class="code-line">    token = self.<span class="code-func">jwt_encode</span>(user)</div>
      <div class="code-line">    <span class="code-keyword">return</span> <span class="code-str">{"token": token}</span></div>
    </div>
  </div>
  <div class="arrow-area" data-el="arrow">
    <div class="arrow-down"></div>
    <div class="arrow-label">项目上下文理解</div>
  </div>
  <div class="tagline" data-el="tagline">它读懂你整个项目</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:14});
    reveal(document.querySelector('[data-el="editor"]'),t,{start:1.2,duration:0.8,y:40,scale:0.97,blur:10});
    reveal(document.querySelector('[data-el="arrow"]'),t,{start:3.5,duration:0.6,y:20,blur:8});
    reveal(document.querySelector('[data-el="tagline"]'),t,{start:4.5,duration:0.7,y:30,blur:10});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.29;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.29));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
