<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 3 - 方案即产品</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

.bg-orb { position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:.1; }
.bg-orb-1 { width:600px;height:600px;background:var(--blue);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite; }
.bg-orb-2 { width:450px;height:450px;background:var(--purple);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite; }
.bg-orb-3 { width:350px;height:350px;background:var(--cyan);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite; }
@keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(120px,80px)} 66%{transform:translate(-60px,150px)} }
@keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-100px,-60px)} 66%{transform:translate(50px,-120px)} }
@keyframes orbFloat3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

.particles { position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden; }
.particle { position:absolute;width:3px;height:3px;background:var(--cyan);border-radius:50%;opacity:0;animation:particleRise linear infinite; }
.particle:nth-child(1){left:8%;animation-duration:14s} .particle:nth-child(2){left:22%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:38%;animation-duration:12s;animation-delay:4s} .particle:nth-child(4){left:52%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:68%;animation-duration:13s;animation-delay:3s} .particle:nth-child(6){left:82%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:92%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise { 0%{transform:translateY(1920px);opacity:0} 10%{opacity:.6} 90%{opacity:.6} 100%{transform:translateY(-20px);opacity:0} }

.scanline { position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.12;z-index:0;animation:scanDown 8s linear infinite; }
@keyframes scanDown { 0%{top:-2px} 100%{top:1920px} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.content { position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:100px 80px 180px 80px;height:100%; }

.corner { position:absolute;width:50px;height:50px;z-index:2;opacity:0; }
.corner-tl { top:60px;left:60px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan); }
.corner-br { bottom:240px;right:60px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan); }

.light-dot { position:absolute;border-radius:50%;z-index:2;opacity:0; }
.light-dot-1 { top:12%;left:8%;width:6px;height:6px;background:var(--cyan);box-shadow:0 0 20px var(--cyan); }
.light-dot-2 { bottom:22%;right:12%;width:8px;height:8px;background:var(--purple);box-shadow:0 0 20px var(--purple); }

.title {
  font-size: 80px; font-weight: bold; text-align: center; margin-bottom: 20px;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #6B3FA0);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  opacity: 0;
}
.subtitle-text {
  font-size: 36px; color: var(--text-dim); text-align: center; margin-bottom: 60px; opacity: 0;
}

.plan-cards { display: flex; flex-direction: column; gap: 32px; width: 100%; max-width: 920px; }

.plan-card {
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 24px;
  padding: 48px;
  position: relative; overflow: hidden;
  opacity: 0;
}
.plan-card::before {
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent);
}
.plan-card .card-header {
  display: flex; align-items: center; gap: 20px; margin-bottom: 16px;
}
.plan-card .card-icon {
  width: 56px; height: 56px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.plan-card .card-icon svg { width: 28px; height: 28px; }
.plan-card .card-title {
  font-size: 40px; font-weight: bold; color: var(--cyan);
}
.plan-card .card-desc {
  font-size: 32px; color: var(--text-dim); line-height: 1.6; padding-left: 76px;
}

.icon-self { background: rgba(34,197,94,0.15); color: #22C55E; }
.icon-gate { background: rgba(0,212,255,0.15); color: #00D4FF; }
.icon-stop { background: rgba(239,68,68,0.15); color: #EF4444; }

.bottom-note {
  margin-top: 56px; text-align: center; opacity: 0;
}
.bottom-note .main {
  font-size: 48px; font-weight: bold; color: var(--cyan);
  text-shadow: 0 0 30px rgba(0,212,255,0.3);
}
.bottom-note .sub {
  font-size: 30px; color: var(--text-dim); margin-top: 12px;
}
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div>
</div>
<div class="scanline"></div>

<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">方案即产品</div>
  <div class="subtitle-text" data-el="subtitle">Plan的质量决定一切</div>

  <div class="plan-cards">
    <div class="plan-card" data-el="card-0">
      <div class="card-header">
        <div class="card-icon icon-self">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        </div>
        <div class="card-title">自包含</div>
      </div>
      <div class="card-desc">所有上下文内联，执行模型无需翻阅历史对话</div>
    </div>

    <div class="plan-card" data-el="card-1">
      <div class="card-header">
        <div class="card-icon icon-gate">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div class="card-title">验证门</div>
      </div>
      <div class="card-desc">每步带命令和预期输出，执行完必须通过验证</div>
    </div>

    <div class="plan-card" data-el="card-2">
      <div class="card-header">
        <div class="card-icon icon-stop">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <div class="card-title">停止条件</div>
      </div>
      <div class="card-desc">现实不符就停，不盲目前进，及时打回</div>
    </div>
  </div>

  <div class="bottom-note" data-el="note">
    <div class="main">给最弱的模型也能跑</div>
    <div class="sub">方案质量 = 执行质量的上限</div>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    const title = document.querySelector('[data-el="title"]');
    const subtitle = document.querySelector('[data-el="subtitle"]');
    const note = document.querySelector('[data-el="note"]');
    const cornerTL = document.querySelector('[data-el="corner-tl"]');
    const cornerBR = document.querySelector('[data-el="corner-br"]');
    const dot1 = document.querySelector('[data-el="dot1"]');
    const dot2 = document.querySelector('[data-el="dot2"]');

    reveal(title, t, { start: 0.1, duration: 0.6, y: 30, blur: 10 });
    reveal(subtitle, t, { start: 0.5, duration: 0.5, y: 20, blur: 8 });

    for (let i = 0; i < 3; i++) {
      const card = document.querySelector(`[data-el="card-${i}"]`);
      reveal(card, t, { start: 0.9 + i * 0.35, duration: 0.65, y: 50, scale: 0.96, blur: 12 });
    }

    reveal(note, t, { start: 3.0, duration: 0.7, y: 25, blur: 8 });

    cornerTL.style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    cornerBR.style.opacity = easeOutQuart(progress(t, 0.5, 0.5));
    dot1.style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    dot2.style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 7;
  window.__mode2Ready = true;

  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) { autoRun = false; _origSeekTo(t); };
  function animate() {
    if (!autoRun) return;
    _origSeekTo(Math.min((performance.now() - startTime) / 1000, 7));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
