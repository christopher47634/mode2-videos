<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0a0a0a; font-family:'Noto Sans SC',sans-serif; overflow:hidden; position:relative; }
body::before { content:''; position:absolute; top:0; left:0; right:0; bottom:0; 
  background: repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px),
              repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px); }
.orb1 { position:absolute; top:20%; right:10%; width:250px; height:250px; background:radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%); filter:blur(50px); }
.content { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px; }

.section-label { font-size:24px; color:rgba(0,212,255,0.6); letter-spacing:8px; text-transform:uppercase; margin-bottom:60px;
  opacity:0; animation:fadeUp 0.6s 0.2s forwards; }

/* Stats grid */
.stats-grid { display:flex; flex-direction:column; gap:40px; width:100%; max-width:800px; }
.stat-row { display:flex; align-items:center; gap:30px; padding:30px 40px; background:rgba(255,255,255,0.03); border:1px solid rgba(0,212,255,0.1); border-radius:16px;
  opacity:0; animation:slideLeft 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
.stat-row:nth-child(1) { animation-delay:0.4s; }
.stat-row:nth-child(2) { animation-delay:0.6s; }
.stat-row:nth-child(3) { animation-delay:0.8s; }

.stat-icon { width:60px; height:60px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.stat-icon.stars { background:rgba(255,215,0,0.15); border:1px solid rgba(255,215,0,0.3); }
.stat-icon.lang { background:rgba(0,212,255,0.15); border:1px solid rgba(0,212,255,0.3); }
.stat-icon.license { background:rgba(0,255,136,0.15); border:1px solid rgba(0,255,136,0.3); }

.stat-info { flex:1; }
.stat-value { font-size:48px; font-weight:900; color:#fff; }
.stat-value.gold { color:#FFD700; }
.stat-value.cyan { color:#00D4FF; }
.stat-value.green { color:#00FF88; }
.stat-label { font-size:24px; color:rgba(255,255,255,0.5); margin-top:4px; }

@keyframes fadeUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideLeft { from { opacity:0; transform:translateX(-60px); } to { opacity:1; transform:translateX(0); } }
.corner-tr { position:absolute; top:6%; right:6%; width:40px; height:40px; border-top:2px solid #00D4FF; border-right:2px solid #00D4FF; opacity:0; animation:fadeUp 0.6s 1.2s forwards; }
.corner-bl { position:absolute; bottom:6%; left:6%; width:40px; height:40px; border-bottom:2px solid #00FF88; border-left:2px solid #00FF88; opacity:0; animation:fadeUp 0.6s 1.4s forwards; }
</style>
</head><body>
<div class="orb1"></div>
<div class="content">
  <div class="section-label">项目数据</div>
  <div class="stats-grid">
    <div class="stat-row">
      <div class="stat-icon stars">⭐</div>
      <div class="stat-info">
        <div class="stat-value gold">98,472</div>
        <div class="stat-label">GitHub Stars</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-icon lang">🐍</div>
      <div class="stat-info">
        <div class="stat-value cyan">Python</div>
        <div class="stat-label">主要语言</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-icon license">📄</div>
      <div class="stat-info">
        <div class="stat-value green">MIT License</div>
        <div class="stat-label">开源协议</div>
      </div>
    </div>
  </div>
</div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
</body></html>
