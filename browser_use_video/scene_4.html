<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0a0a0a; font-family:'Noto Sans SC',sans-serif; overflow:hidden; position:relative; }
body::before { content:''; position:absolute; top:0; left:0; right:0; bottom:0; 
  background: repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px),
              repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(0,212,255,0.03) 79px, rgba(0,212,255,0.03) 80px); }
.orb1 { position:absolute; bottom:20%; left:15%; width:280px; height:280px; background:radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%); filter:blur(50px); }
.content { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px; }

.section-label { font-size:24px; color:rgba(0,212,255,0.6); letter-spacing:8px; text-transform:uppercase; margin-bottom:40px;
  opacity:0; animation:fadeUp 0.6s 0.2s forwards; }

.feature-card { width:900px; padding:60px; background:rgba(255,255,255,0.03); border:1px solid rgba(0,212,255,0.15); border-radius:24px;
  opacity:0; animation:scaleIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
.feature-icon { width:80px; height:80px; border-radius:20px; background:rgba(0,212,255,0.1); border:2px solid rgba(0,212,255,0.3); display:flex; align-items:center; justify-content:center; font-size:40px; margin-bottom:30px; }
.feature-title { font-size:56px; font-weight:900; color:#00D4FF; margin-bottom:20px; }
.feature-desc { font-size:32px; color:rgba(255,255,255,0.7); line-height:1.6; margin-bottom:30px; }

/* Task examples */
.task-list { display:flex; flex-direction:column; gap:16px; }
.task-item { display:flex; align-items:center; gap:16px; padding:16px 24px; background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.1); border-radius:12px;
  opacity:0; animation:slideLeft 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
.task-item:nth-child(1) { animation-delay:0.8s; }
.task-item:nth-child(2) { animation-delay:1.0s; }
.task-item:nth-child(3) { animation-delay:1.2s; }
.task-item:nth-child(4) { animation-delay:1.4s; }
.task-icon { font-size:28px; }
.task-text { font-size:24px; color:rgba(255,255,255,0.8); }

@keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideLeft { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:translateX(0); } }
.corner-tr { position:absolute; top:6%; right:6%; width:40px; height:40px; border-top:2px solid #00D4FF; border-right:2px solid #00D4FF; opacity:0; animation:fadeUp 0.6s 1.8s forwards; }
.corner-bl { position:absolute; bottom:6%; left:6%; width:40px; height:40px; border-bottom:2px solid #00FF88; border-left:2px solid #00FF88; opacity:0; animation:fadeUp 0.6s 2.0s forwards; }
</style>
</head><body>
<div class="orb1"></div>
<div class="content">
  <div class="section-label">应用场景</div>
  <div class="feature-card">
    <div class="feature-icon">⚡</div>
    <div class="feature-title">任何网页任务都能自动化</div>
    <div class="feature-desc">从简单到复杂，Browser Use都能搞定：</div>
    <div class="task-list">
      <div class="task-item"><div class="task-icon">🛒</div><div class="task-text">自动比价、下单、追踪物流</div></div>
      <div class="task-item"><div class="task-icon">📝</div><div class="task-text">自动填写表单、提交申请</div></div>
      <div class="task-item"><div class="task-icon">📊</div><div class="task-text">自动采集数据、生成报告</div></div>
      <div class="task-item"><div class="task-icon">🔍</div><div class="task-text">自动搜索、筛选、整理信息</div></div>
    </div>
  </div>
</div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
</body></html>
