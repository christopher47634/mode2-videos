<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 3 - 多语言+长上下文</title>
<style>
@font-face {
  font-family: 'ZCOOL KuaiLe';
  src: url('../../.fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'Noto Sans CJK';
  src: url('../../.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'Noto Sans CJK Bold';
  src: url('../../.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px; height: 1920px;
  background: #06101F;
  overflow: hidden; position: relative;
  font-family: 'Noto Sans CJK', sans-serif;
}

.bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

.orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.25; }
.orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #8B5CF6, transparent 70%); top: 400px; left: -200px; animation: of1 10s ease-in-out infinite; }
.orb-2 { width: 350px; height: 350px; background: radial-gradient(circle, #00D4FF, transparent 70%); bottom: 400px; right: -100px; animation: of2 12s ease-in-out infinite; }
@keyframes of1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(70px,50px)} }
@keyframes of2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-30px)} }

.particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px); z-index: 1; }

.content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; padding-top: 280px; }

.scene-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 64px; color: #fff; letter-spacing: 4px; opacity: 0; transform: translateY(-30px); transition: all 0.6s ease-out; margin-bottom: 100px; text-align: center; line-height: 1.4; }
.scene-title.visible { opacity: 1; transform: translateY(0); }

/* 语言标签云 */
.lang-cloud { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; max-width: 900px; margin-bottom: 160px; }

.glass-badge {
  background: rgba(139, 92, 246, 0.12);
  border: 1px solid rgba(139, 92, 246, 0.3);
  border-radius: 40px;
  padding: 16px 36px;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  font-size: 34px;
  color: rgba(255,255,255,0.85);
  letter-spacing: 2px;
  opacity: 0;
  transform: scale(0) rotate(-10deg);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.glass-badge.visible { opacity: 1; transform: scale(1) rotate(0deg); }

.glass-badge:nth-child(even) {
  background: rgba(0, 212, 255, 0.1);
  border-color: rgba(0, 212, 255, 0.25);
}

/* 进度条区 */
.ctx-section { width: 85%; text-align: center; }

.ctx-label { font-size: 36px; color: rgba(255,255,255,0.5); margin-bottom: 30px; opacity: 0; transition: opacity 0.5s; }
.ctx-label.visible { opacity: 1; }

.progress-wrap {
  width: 100%; height: 40px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(139,92,246,0.2);
  opacity: 0; transform: scaleX(0);
  transform-origin: left;
  transition: all 0.8s ease-out;
}
.progress-wrap.visible { opacity: 1; transform: scaleX(1); }

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #8B5CF6, #00D4FF);
  border-radius: 20px;
  transition: width 2s ease-out;
  box-shadow: 0 0 20px rgba(139,92,246,0.5);
}

.ctx-labels { display: flex; justify-content: space-between; margin-top: 16px; font-size: 30px; color: rgba(255,255,255,0.4); opacity: 0; transition: opacity 0.5s 0.3s; }
.ctx-labels.visible { opacity: 1; }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas class="particle-canvas" id="particles"></canvas>
  <div class="scanline"></div>
</div>

<div class="content">
  <div class="scene-title" id="title">100+语言 · 256K上下文</div>
  <div class="lang-cloud" id="langCloud">
    <div class="glass-badge">中文</div>
    <div class="glass-badge">English</div>
    <div class="glass-badge">日本語</div>
    <div class="glass-badge">한국어</div>
    <div class="glass-badge">Français</div>
    <div class="glass-badge">العربية</div>
    <div class="glass-badge">Deutsch</div>
    <div class="glass-badge">Русский</div>
  </div>
  <div class="ctx-section">
    <div class="ctx-label" id="ctxLabel">上下文长度</div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="ctx-labels" id="ctxLabels">
      <span>256K</span><span>1M tokens</span>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 1080; canvas.height = 1920;
  const ps = [];
  for (let i = 0; i < 50; i++) { ps.push({ x:Math.random()*1080, y:Math.random()*1920, r:Math.random()*2+0.5, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5, a:Math.random()*0.25+0.1 }); }
  function draw() { ctx.clearRect(0,0,1080,1920); ps.forEach(p=>{ p.x+=p.vx;p.y+=p.vy; if(p.x<0)p.x=1080;if(p.x>1080)p.x=0;if(p.y<0)p.y=1920;if(p.y>1920)p.y=0; ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${p.a})`;ctx.fill(); }); requestAnimationFrame(draw); }
  draw();
})();

const DURATION = 4.76;
window.__mode2Duration = DURATION;
window.__mode2Ready = true;

let lastT = -1;
let progressSet = false;

function seekTo(t) {
  if (Math.abs(t - lastT) < 0.01) return;
  lastT = t;

  if (t >= 0.0) document.getElementById('title').classList.add('visible');

  // 标签弹入，每个间隔0.15s
  if (t >= 0.5) {
    const badges = document.querySelectorAll('.glass-badge');
    badges.forEach((b, i) => {
      const delay = 0.5 + i * 0.15;
      if (t >= delay) b.classList.add('visible');
    });
  }

  if (t >= 2.0) document.getElementById('ctxLabel').classList.add('visible');
  if (t >= 2.2) document.getElementById('progressWrap').classList.add('visible');
  if (t >= 2.4) document.getElementById('ctxLabels').classList.add('visible');

  // 进度条填充
  if (t >= 2.5 && !progressSet) {
    document.getElementById('progressBar').style.width = '100%';
    progressSet = true;
  }

  if (t >= 4.2) {
    const fp = Math.min((t - 4.2) / 0.56, 1);
    document.querySelector('.content').style.opacity = 1 - fp;
  }
}

seekTo(0);
</script>
</body>
</html>
