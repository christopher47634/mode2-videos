<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 5 - 全平台+AI</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--cyan:#00D4FF;--green:#18C98B;--blue:#0088CC;--purple:#6B3FA0;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:0.1}
.bg-orb-1{width:600px;height:600px;background:var(--blue);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--purple);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:350px;height:350px;background:var(--cyan);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--cyan);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:8%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:22%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:38%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:52%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:68%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:82%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:92%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.12;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 80px 180px 80px;height:100%}
.corner{position:absolute;width:50px;height:50px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.corner-br{bottom:240px;right:60px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}
.light-dot-2{bottom:22%;right:12%;width:8px;height:8px;background:var(--purple);box-shadow:0 0 20px var(--purple)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Scene 5 specific */
.scene-title {
  font-size: 56px; font-weight: bold; opacity: 0;
  color: var(--cyan);
  margin-bottom: 50px; text-align: center;
}
.platform-row {
  display: flex; gap: 30px; margin-bottom: 60px;
  width: 880px; justify-content: center;
}
.platform-card {
  flex: 1; text-align: center;
  background: rgba(10,20,40,0.6);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0,212,255,0.15);
  border-radius: 24px; padding: 36px 24px;
  opacity: 0; position: relative; overflow: hidden;
}
.platform-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}
.platform-icon {
  font-size: 56px; margin-bottom: 12px;
}
.platform-name {
  font-size: 30px; font-weight: bold; color: var(--cyan);
}

.ai-section {
  opacity: 0; width: 880px;
  background: rgba(10,20,40,0.6);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(107,63,160,0.25);
  border-radius: 24px; padding: 44px 48px;
  position: relative; overflow: hidden;
}
.ai-section::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, rgba(107,63,160,0.4), transparent);
}
.ai-header {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 20px;
}
.ai-icon {
  font-size: 48px;
}
.ai-title {
  font-size: 36px; font-weight: bold;
  color: var(--purple);
}
.ai-desc {
  font-size: 28px; color: var(--text-dim);
  line-height: 1.6;
}
.ai-key {
  display: inline-block;
  background: rgba(107,63,160,0.15);
  border: 1px solid rgba(107,63,160,0.3);
  border-radius: 8px; padding: 4px 14px;
  font-size: 24px; color: var(--purple);
  font-family: monospace; margin-top: 12px;
}

.unlocked-badge {
  opacity: 0; margin-top: 40px;
  display: flex; align-items: center; gap: 16px;
  font-size: 32px; font-weight: bold;
  color: var(--green);
  letter-spacing: 3px;
}
.unlocked-badge::before,
.unlocked-badge::after {
  content: '';
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(24,201,139,0.3), transparent);
}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="scene-title" data-el="title">全平台 + AI教练</div>
  <div class="platform-row">
    <div class="platform-card" data-el="p1">
      <div class="platform-icon">🍎</div>
      <div class="platform-name">macOS</div>
    </div>
    <div class="platform-card" data-el="p2">
      <div class="platform-icon">🤖</div>
      <div class="platform-name">Android</div>
    </div>
    <div class="platform-card" data-el="p3">
      <div class="platform-icon">📱</div>
      <div class="platform-name">iOS</div>
    </div>
  </div>
  <div class="ai-section" data-el="ai">
    <div class="ai-header">
      <div class="ai-icon">🧠</div>
      <div class="ai-title">AI 智能教练</div>
    </div>
    <div class="ai-desc">
      自定义AI模型 · 用自己的API Key<br>
      个性化训练建议 · 睡眠分析 · 恢复指导
    </div>
    <div class="ai-key">sk-***your-api-key***</div>
  </div>
  <div class="unlocked-badge" data-el="badge">🔓 所有功能解锁</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.6,y:30,blur:10});
    reveal(document.querySelector('[data-el="p1"]'),t,{start:0.7,duration:0.5,y:25,blur:8});
    reveal(document.querySelector('[data-el="p2"]'),t,{start:1.0,duration:0.5,y:25,blur:8});
    reveal(document.querySelector('[data-el="p3"]'),t,{start:1.3,duration:0.5,y:25,blur:8});
    reveal(document.querySelector('[data-el="ai"]'),t,{start:2.2,duration:0.8,y:35,blur:12});
    reveal(document.querySelector('[data-el="badge"]'),t,{start:4.5,duration:0.6,y:20,blur:6,scale:1});

    const cp=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.61;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.61));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
