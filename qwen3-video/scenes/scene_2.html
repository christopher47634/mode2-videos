<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - 双模切换</title>
<style>
@font-face {
  font-family: 'ZCOOL KuaiLe';
  src: url('../../.fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'Noto Sans CJK';
  src: url('../../.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'Noto Sans CJK Bold';
  src: url('../../.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px; height: 1920px;
  background: #06101F;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans CJK', sans-serif;
}

.bg-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

.orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.25; }
.orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #8B5CF6, transparent 70%); top: 700px; left: -100px; animation: of1 9s ease-in-out infinite; }
.orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #00D4FF, transparent 70%); top: 700px; right: -80px; animation: of2 11s ease-in-out infinite; }
@keyframes of1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,30px)} }
@keyframes of2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-25px)} }

.particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.scanline {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139,92,246,0.03) 3px, rgba(139,92,246,0.03) 4px);
  z-index: 1;
}

.content {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 10; display: flex; flex-direction: column;
  align-items: center; padding-top: 320px;
}

.scene-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 72px; color: #fff;
  letter-spacing: 6px; opacity: 0;
  transform: translateY(-30px);
  transition: all 0.6s ease-out;
  margin-bottom: 120px;
}
.scene-title.visible { opacity: 1; transform: translateY(0); }

.cards-row {
  display: flex; align-items: center; gap: 40px;
  margin-bottom: 120px;
}

/* glass 卡片 */
.glass {
  background: rgba(139, 92, 246, 0.1);
  border: 1px solid rgba(139, 92, 246, 0.25);
  border-radius: 30px;
  padding: 50px 40px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 340px; text-align: center;
}

.card-left {
  transform: translateX(-600px);
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card-left.visible { transform: translateX(0); }

.card-right {
  transform: translateX(600px);
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card-right.visible { transform: translateX(0); }

.card-icon { font-size: 100px; margin-bottom: 20px; }

.card-title {
  font-family: 'Noto Sans CJK Bold', sans-serif;
  font-size: 40px; color: #fff;
  letter-spacing: 4px;
}

.card-sub { font-size: 28px; color: rgba(255,255,255,0.5); margin-top: 10px; }

.card-left { border-color: rgba(139, 92, 246, 0.35); }
.card-right { border-color: rgba(0, 212, 255, 0.25); background: rgba(0, 212, 255, 0.08); }

/* 中间箭头 */
.mid-arrow {
  font-size: 80px; color: #00D4FF;
  text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
  opacity: 0; transform: scale(0);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.mid-arrow.visible { opacity: 1; transform: scale(1); }

/* 底部文字 */
.bottom-text {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 52px; color: rgba(255,255,255,0.7);
  letter-spacing: 8px;
  opacity: 0; transform: translateY(30px);
  transition: all 0.6s ease-out;
}
.bottom-text.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas class="particle-canvas" id="particles"></canvas>
  <div class="scanline"></div>
</div>

<div class="content">
  <div class="scene-title" id="title">一个模型两种模式</div>
  <div class="cards-row">
    <div class="glass card-left" id="cardL">
      <div class="card-icon">🧠</div>
      <div class="card-title">深度思考</div>
      <div class="card-sub">慢想 · 精确</div>
    </div>
    <div class="mid-arrow" id="arrow">⇄</div>
    <div class="glass card-right" id="cardR">
      <div class="card-icon">⚡</div>
      <div class="card-title">快速回答</div>
      <div class="card-sub">快答 · 高效</div>
    </div>
  </div>
  <div class="bottom-text" id="bottomText">无缝切换</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 1080; canvas.height = 1920;
  const ps = [];
  for (let i = 0; i < 55; i++) {
    ps.push({ x: Math.random()*1080, y: Math.random()*1920, r: Math.random()*2+0.5,
      vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.6, a: Math.random()*0.3+0.1 });
  }
  function draw() {
    ctx.clearRect(0,0,1080,1920);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=1080; if(p.x>1080)p.x=0; if(p.y<0)p.y=1920; if(p.y>1920)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(139,92,246,${p.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const DURATION = 6.41;
window.__mode2Duration = DURATION;
window.__mode2Ready = true;

let lastT = -1;

function seekTo(t) {
  if (Math.abs(t - lastT) < 0.01) return;
  lastT = t;

  if (t >= 0.0) document.getElementById('title').classList.add('visible');
  if (t >= 0.8) document.getElementById('cardL').classList.add('visible');
  if (t >= 1.2) document.getElementById('arrow').classList.add('visible');
  if (t >= 1.0) document.getElementById('cardR').classList.add('visible');
  if (t >= 2.5) document.getElementById('bottomText').classList.add('visible');

  if (t >= 5.5) {
    const fp = Math.min((t - 5.5) / 0.9, 1);
    document.querySelector('.content').style.opacity = 1 - fp;
  }
}

seekTo(0);
</script>
</body>
</html>
