<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - 持久记忆系统</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 600px; height: 600px; background: var(--blue);
  top: -150px; left: -150px;
  animation: orbFloat1 20s ease-in-out infinite;
}
.bg-orb-2 {
  width: 450px; height: 450px; background: var(--purple);
  bottom: -100px; right: -100px;
  animation: orbFloat2 25s ease-in-out infinite;
}
.bg-orb-3 {
  width: 350px; height: 350px; background: var(--cyan);
  top: 45%; left: 50%; transform: translate(-50%, -50%);
  animation: orbFloat3 18s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(120px,80px); }
  66% { transform: translate(-60px,150px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,-60px); }
  66% { transform: translate(50px,-120px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.3); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 8%; animation-duration: 14s; animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 12s; animation-delay: 4s; }
.particle:nth-child(4) { left: 52%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 68%; animation-duration: 13s; animation-delay: 3s; }
.particle:nth-child(6) { left: 82%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(7) { left: 92%; animation-duration: 11s; animation-delay: 7s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 120px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2;
  opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

/* === Floating Light Points === */
.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 12%; left: 8%; width: 6px; height: 6px;
  background: var(--cyan); box-shadow: 0 0 20px var(--cyan);
}
.light-dot-2 {
  bottom: 22%; right: 12%; width: 8px; height: 8px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}

/* === Title === */
.scene-title {
  font-size: 80px;
  font-weight: bold;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #6B3FA0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 6px;
  margin-bottom: 20px;
  opacity: 0;
}

.scene-subtitle {
  font-size: 36px;
  color: var(--text-dim);
  margin-bottom: 60px;
  opacity: 0;
}

/* === Memory Cards === */
.memory-cards {
  display: flex;
  flex-direction: column;
  gap: 36px;
  width: 100%;
  max-width: 880px;
}

.memory-card {
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 24px;
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
  opacity: 0;
}
.memory-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}

.memory-card .card-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin-bottom: 20px;
}

.memory-card:nth-child(1) .card-icon {
  background: rgba(0, 212, 255, 0.15);
  color: var(--cyan);
}
.memory-card:nth-child(2) .card-icon {
  background: rgba(139, 92, 246, 0.15);
  color: #A78BFA;
}
.memory-card:nth-child(3) .card-icon {
  background: rgba(255, 215, 0, 0.12);
  color: #FFD700;
}

.memory-card .card-filename {
  font-size: 38px;
  font-weight: bold;
  color: var(--cyan);
  font-family: monospace;
  margin-bottom: 12px;
}

.memory-card .card-desc {
  font-size: 32px;
  color: var(--text-dim);
  line-height: 1.5;
}

.memory-card .card-glow {
  position: absolute;
  top: -50%; right: -20%;
  width: 300px; height: 300px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.08;
  pointer-events: none;
}
.memory-card:nth-child(1) .card-glow { background: var(--cyan); }
.memory-card:nth-child(2) .card-glow { background: #A78BFA; }
.memory-card:nth-child(3) .card-glow { background: #FFD700; }

/* === Bottom Note === */
.bottom-note {
  margin-top: auto;
  font-size: 32px;
  color: var(--text-dim);
  text-align: center;
  opacity: 0;
  padding-bottom: 20px;
}
.bottom-note .glow {
  color: var(--cyan);
  font-weight: bold;
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<!-- L-Corner Decorations -->
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>

<!-- Floating Light Points -->
<div class="light-dot light-dot-1" data-el="dot1"></div>
<div class="light-dot light-dot-2" data-el="dot2"></div>

<!-- Content -->
<div class="content">
  <div class="scene-title" data-el="title">跨会话持久记忆</div>
  <div class="scene-subtitle" data-el="subtitle">Persistent Memory System</div>

  <div class="memory-cards">
    <div class="memory-card" data-el="card1">
      <div class="card-glow"></div>
      <div class="card-icon">📄</div>
      <div class="card-filename">MEMORY.md</div>
      <div class="card-desc">项目知识库 — 自动积累项目架构、技术栈和关键决策</div>
    </div>

    <div class="memory-card" data-el="card2">
      <div class="card-glow"></div>
      <div class="card-icon">🔖</div>
      <div class="card-filename">checkpoint.md</div>
      <div class="card-desc">会话检查点 — 保存当前任务进度和上下文快照</div>
    </div>

    <div class="memory-card" data-el="card3">
      <div class="card-glow"></div>
      <div class="card-icon">📝</div>
      <div class="card-filename">notes.md</div>
      <div class="card-desc">临时笔记 — 记录思考过程和中间发现</div>
    </div>
  </div>

  <div class="bottom-note" data-el="note">
    下次打开 <span class="glow">自动恢复上下文</span>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'), t, { start: 0.2, duration: 0.6, y: 30, blur: 10 });
    reveal(document.querySelector('[data-el="subtitle"]'), t, { start: 0.5, duration: 0.5, y: 20, blur: 6 });

    // Staggered card entry
    reveal(document.querySelector('[data-el="card1"]'), t, { start: 1.0, duration: 0.7, y: 50, scale: 0.95, blur: 12 });
    reveal(document.querySelector('[data-el="card2"]'), t, { start: 1.4, duration: 0.7, y: 50, scale: 0.95, blur: 12 });
    reveal(document.querySelector('[data-el="card3"]'), t, { start: 1.8, duration: 0.7, y: 50, scale: 0.95, blur: 12 });

    reveal(document.querySelector('[data-el="note"]'), t, { start: 3.0, duration: 0.6, y: 20, blur: 6 });

    // Corners
    document.querySelector('[data-el="corner-tl"]').style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    document.querySelector('[data-el="corner-br"]').style.opacity = easeOutQuart(progress(t, 0.5, 0.5));

    // Light dots
    document.querySelector('[data-el="dot1"]').style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    document.querySelector('[data-el="dot2"]').style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 6;
  window.__mode2Ready = true;

  // Auto-run for preview
  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) {
    autoRun = false;
    _origSeekTo(t);
  };
  function animate() {
    if (!autoRun) return;
    const elapsed = (performance.now() - startTime) / 1000;
    _origSeekTo(Math.min(elapsed, 6));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
