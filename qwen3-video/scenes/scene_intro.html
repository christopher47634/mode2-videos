<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene Intro</title>
<style>
@font-face {
  font-family: 'ZCOOL KuaiLe';
  src: url('../../.fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'Noto Sans CJK';
  src: url('../../.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'Noto Sans CJK Bold';
  src: url('../../.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1920px;
  background: #06101F;
  overflow: hidden;
  position: relative;
  font-family: 'Noto Sans CJK', sans-serif;
}

/* === 背景三层 === */
.bg-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* 光球 */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.3;
}
.orb-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #8B5CF6 0%, transparent 70%);
  top: 200px; left: -100px;
  animation: orbFloat1 8s ease-in-out infinite;
}
.orb-2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #00D4FF 0%, transparent 70%);
  bottom: 300px; right: -50px;
  animation: orbFloat2 10s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(80px, 60px) scale(1.1); }
}
@keyframes orbFloat2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-60px, -40px) scale(1.15); }
}

/* 粒子 */
.particle-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* 扫描线 */
.scanline {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(139, 92, 246, 0.03) 3px,
    rgba(139, 92, 246, 0.03) 4px
  );
  z-index: 1;
}

/* === 内容层 === */
.content {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 60px;
}

/* Qwen3 主标题 */
.main-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 180px;
  color: #8B5CF6;
  text-shadow: 0 0 60px rgba(139, 92, 246, 0.6), 0 0 120px rgba(139, 92, 246, 0.3);
  letter-spacing: 20px;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.main-title.visible {
  opacity: 1;
  transform: scale(1);
}

/* 打字机光标 */
.main-title .cursor {
  display: inline-block;
  width: 6px;
  height: 160px;
  background: #8B5CF6;
  margin-left: 10px;
  animation: blink 0.6s infinite;
  vertical-align: middle;
  opacity: 0;
}
.main-title .cursor.active {
  opacity: 1;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* glass-badge 副标题 */
.glass-badge {
  background: rgba(139, 92, 246, 0.12);
  border: 1px solid rgba(139, 92, 246, 0.3);
  border-radius: 50px;
  padding: 20px 60px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  font-family: 'Noto Sans CJK', sans-serif;
  font-size: 42px;
  color: rgba(255, 255, 255, 0.9);
  letter-spacing: 6px;
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.6s ease-out;
}

.glass-badge.visible {
  opacity: 1;
  transform: translateY(0);
}

/* 钩子文字 */
.hook-text {
  font-family: 'Noto Sans CJK', sans-serif;
  font-size: 48px;
  color: rgba(255, 255, 255, 0.5);
  text-align: center;
  line-height: 1.8;
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.8s ease-out;
  max-width: 800px;
}

.hook-text.visible {
  opacity: 1;
  transform: translateY(0);
}

.hook-text .typing-cursor {
  display: inline-block;
  width: 3px;
  height: 44px;
  background: rgba(255, 255, 255, 0.5);
  margin-left: 4px;
  vertical-align: middle;
  animation: blink 0.5s infinite;
  opacity: 0;
}
.hook-text .typing-cursor.active {
  opacity: 1;
}
</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas class="particle-canvas" id="particles"></canvas>
  <div class="scanline"></div>
</div>

<!-- 内容 -->
<div class="content">
  <div class="main-title" id="mainTitle">Qwen3<span class="cursor" id="cursor1"></span></div>
  <div class="glass-badge" id="subtitle">阿里 · 通义千问 · 全新开源</div>
  <div class="hook-text" id="hookText">当开源大模型<br>卷到极致...<span class="typing-cursor" id="cursor2"></span></div>
</div>

<script>
// === 粒子系统 ===
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 1080;
  canvas.height = 1920;

  const particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      alpha: Math.random() * 0.4 + 0.1
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, 1080, 1920);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = 1080;
      if (p.x > 1080) p.x = 0;
      if (p.y < 0) p.y = 1920;
      if (p.y > 1920) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(139, 92, 246, ${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
})();

// === seekTo 时间驱动动画 ===
const DURATION = 4.0;
window.__mode2Duration = DURATION;
window.__mode2Ready = true;

let lastT = -1;

function seekTo(t) {
  if (Math.abs(t - lastT) < 0.01) return;
  lastT = t;

  const title = document.getElementById('mainTitle');
  const cursor1 = document.getElementById('cursor1');
  const badge = document.getElementById('subtitle');
  const hook = document.getElementById('hookText');
  const cursor2 = document.getElementById('cursor2');

  // 0.0-1.0s: 标题打字机+缩放出现
  if (t >= 0.0) {
    title.classList.add('visible');
    // 打字机效果：逐字显示
    const fullText = 'Qwen3';
    const progress = Math.min(t / 0.8, 1);
    const chars = Math.floor(progress * fullText.length);
    title.innerHTML = fullText.substring(0, chars) + '<span class="cursor' + (t < 1.0 ? ' active' : '') + '"></span>';
  }

  // 1.0-1.8s: 副标题滑入
  if (t >= 1.0) {
    badge.classList.add('visible');
  }

  // 1.8-3.2s: 钩子文字
  if (t >= 1.8) {
    hook.classList.add('visible');
    const hookProgress = Math.min((t - 1.8) / 1.0, 1);
    const hookFull = '当开源大模型\n卷到极致...';
    const hookChars = Math.floor(hookProgress * hookFull.length);
    let display = hookFull.substring(0, hookChars);
    display = display.replace('\n', '<br>');
    hook.innerHTML = display + '<span class="typing-cursor' + (t < 3.2 ? ' active' : '') + '"></span>';
  }

  // 3.5-4.0s: 淡出
  if (t >= 3.5) {
    const fadeProgress = Math.min((t - 3.5) / 0.5, 1);
    document.querySelector('.content').style.opacity = 1 - fadeProgress;
  }
}

// 初始调用
seekTo(0);
</script>
</body>
</html>
