<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - ds4 核心特性</title>
<style>
@font-face {
  font-family: 'LXGW WenKai';
  src: url('file:///mnt/e/Fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'LXGW WenKai';
  src: url('file:///mnt/e/Fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///mnt/e/Fonts/InterVariable.ttf') format('truetype');
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'LXGW WenKai', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 550px; height: 550px; background: var(--blue);
  top: -120px; right: -120px;
  animation: orbFloat1 22s ease-in-out infinite;
}
.bg-orb-2 {
  width: 400px; height: 400px; background: var(--purple);
  bottom: 200px; left: -100px;
  animation: orbFloat2 28s ease-in-out infinite;
}
.bg-orb-3 {
  width: 300px; height: 300px; background: var(--cyan);
  top: 50%; left: 60%; transform: translate(-50%, -50%);
  animation: orbFloat3 16s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,80px); }
  66% { transform: translate(60px,-50px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(80px,-60px); }
  66% { transform: translate(-50px,100px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.25); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 12%; animation-duration: 13s; animation-delay: 0s; }
.particle:nth-child(2) { left: 28%; animation-duration: 17s; animation-delay: 2s; }
.particle:nth-child(3) { left: 45%; animation-duration: 11s; animation-delay: 3s; }
.particle:nth-child(4) { left: 60%; animation-duration: 15s; animation-delay: 1s; }
.particle:nth-child(5) { left: 75%; animation-duration: 14s; animation-delay: 4s; }
.particle:nth-child(6) { left: 88%; animation-duration: 12s; animation-delay: 6s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 100px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2; opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

/* === Floating Light Points === */
.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 10%; right: 10%; width: 6px; height: 6px;
  background: var(--cyan); box-shadow: 0 0 20px var(--cyan);
}
.light-dot-2 {
  bottom: 25%; left: 8%; width: 8px; height: 8px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}

/* === Section Header === */
.section-header {
  text-align: center;
  margin-bottom: 56px;
  opacity: 0;
}
.section-label {
  font-family: 'Inter', sans-serif;
  font-size: 26px; font-weight: 600;
  color: var(--cyan);
  letter-spacing: 6px;
  text-transform: uppercase;
}
.section-title {
  font-size: 72px;
  font-weight: bold;
  margin-top: 20px;
  background: linear-gradient(135deg, #FFFFFF, #00D4FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.2;
}

/* === Feature Cards === */
.feature-cards {
  display: flex;
  flex-direction: column;
  gap: 32px;
  width: 100%;
  max-width: 880px;
}

.feature-card {
  background: rgba(10, 20, 40, 0.55);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.1);
  border-radius: 24px;
  padding: 44px 48px;
  display: flex;
  align-items: center;
  gap: 36px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateX(-60px);
  transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
}
.feature-card.show {
  opacity: 1;
  transform: translateX(0);
}

.feature-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.25), transparent);
}
.feature-card::after {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
  border-radius: 3px;
}

.feature-card:nth-child(1)::after { background: linear-gradient(180deg, var(--cyan), transparent); }
.feature-card:nth-child(2)::after { background: linear-gradient(180deg, #FFD700, transparent); }
.feature-card:nth-child(3)::after { background: linear-gradient(180deg, var(--purple), transparent); }

.feature-icon {
  width: 88px; height: 88px;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  flex-shrink: 0;
  position: relative;
}
.feature-card:nth-child(1) .feature-icon {
  background: rgba(0,212,255,0.1);
  border: 1px solid rgba(0,212,255,0.2);
}
.feature-card:nth-child(2) .feature-icon {
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.2);
}
.feature-card:nth-child(3) .feature-icon {
  background: rgba(107,63,160,0.1);
  border: 1px solid rgba(107,63,160,0.25);
}

.feature-text {
  flex: 1;
}
.feature-name {
  font-size: 40px;
  font-weight: bold;
  margin-bottom: 10px;
  line-height: 1.3;
}
.feature-card:nth-child(1) .feature-name { color: var(--cyan); }
.feature-card:nth-child(2) .feature-name { color: #FFD700; }
.feature-card:nth-child(3) .feature-name { color: #A78BFA; }

.feature-desc {
  font-size: 30px;
  color: var(--text-dim);
  line-height: 1.5;
}

.feature-number {
  position: absolute;
  top: 20px; right: 28px;
  font-family: 'Inter', sans-serif;
  font-size: 72px; font-weight: 800;
  opacity: 0.04;
  line-height: 1;
}

/* === Bottom Tag === */
.bottom-tag {
  margin-top: auto;
  display: flex; align-items: center; gap: 12px;
  opacity: 0;
}
.bottom-tag .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}
.bottom-tag .tag-text {
  font-size: 24px;
  color: var(--text-dim);
  font-family: 'Inter', sans-serif;
  letter-spacing: 2px;
}

/* === Animation Classes === */
.anim-fade-up {
  opacity: 0; transform: translateY(40px);
  transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
}
.anim-fade-up.show { opacity: 1; transform: translateY(0); }

.anim-scale-in {
  opacity: 0; transform: scale(0.85);
  transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.34,1.56,0.64,1);
}
.anim-scale-in.show { opacity: 1; transform: scale(1); }

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-12px); }
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<!-- L-Corner Decorations -->
<div class="corner corner-tl anim-scale-in" data-delay="0.3"></div>
<div class="corner corner-br anim-scale-in" data-delay="0.5"></div>

<!-- Floating Light Points -->
<div class="light-dot light-dot-1 anim-scale-in" data-delay="0.4" style="animation: float 3s ease-in-out infinite;"></div>
<div class="light-dot light-dot-2 anim-scale-in" data-delay="0.6" style="animation: float 4s ease-in-out infinite reverse;"></div>

<!-- Content -->
<div class="content">
  <div class="section-header anim-fade-up" data-delay="0.2">
    <div class="section-label">CORE FEATURES</div>
    <div class="section-title">核心特性</div>
  </div>

  <div class="feature-cards">
    <!-- Feature 1: DeepSeek 4 Local Inference -->
    <div class="feature-card" data-delay="0.6">
      <div class="feature-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="feature-text">
        <div class="feature-name">DeepSeek 4 本地推理</div>
        <div class="feature-desc">无需联网，完全离线运行大模型</div>
      </div>
      <div class="feature-number">01</div>
    </div>

    <!-- Feature 2: Pure C Implementation -->
    <div class="feature-card" data-delay="1.0">
      <div class="feature-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
          <line x1="14" y1="4" x2="10" y2="20"/>
        </svg>
      </div>
      <div class="feature-text">
        <div class="feature-name">纯 C 实现</div>
        <div class="feature-desc">极致性能，零依赖，轻量部署</div>
      </div>
      <div class="feature-number">02</div>
    </div>

    <!-- Feature 3: Multi-platform GPU -->
    <div class="feature-card" data-delay="1.4">
      <div class="feature-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <rect x="6" y="7" width="4" height="4" rx="1"/>
          <rect x="14" y="7" width="4" height="4" rx="1"/>
        </svg>
      </div>
      <div class="feature-text">
        <div class="feature-name">Metal / CUDA / ROCm</div>
        <div class="feature-desc">全平台GPU加速，Apple到AMD全覆盖</div>
      </div>
      <div class="feature-number">03</div>
    </div>
  </div>

  <div class="bottom-tag anim-fade-up" data-delay="1.8">
    <div class="dot"></div>
    <div class="tag-text">POWERED BY ANTIREZ</div>
  </div>
</div>

<script>
window.__mode2Ready = true;

function seekTo(t) {
  document.querySelectorAll('[data-delay]').forEach(el => {
    const delay = parseFloat(el.dataset.delay);
    if (t >= delay) {
      if (el.classList.contains('feature-card')) {
        el.classList.add('show');
      } else {
        el.classList.add('show');
      }
    } else {
      if (el.classList.contains('feature-card')) {
        el.classList.remove('show');
      } else {
        el.classList.remove('show');
      }
    }
  });

  // Light dots and corners
  document.querySelectorAll('.light-dot, .corner').forEach(el => {
    const delay = parseFloat(el.dataset.delay);
    el.style.opacity = t >= delay ? '1' : '0';
  });
}

// Auto-run for preview (stops when seekTo is called externally)
let startTime = performance.now();
let autoRun = true;
let _origSeekTo = seekTo;
window.seekTo = function(t) {
  autoRun = false;
  _origSeekTo(t);
};
function animateElements() {
  if (!autoRun) return;
  const elapsed = (performance.now() - startTime) / 1000;
  _origSeekTo(elapsed);
  requestAnimationFrame(animateElements);
}
animateElements();
</script>
</body>
</html>
