<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene Intro - 本周推荐</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 600px; height: 600px; background: var(--blue);
  top: -150px; left: -150px;
  animation: orbFloat1 20s ease-in-out infinite;
}
.bg-orb-2 {
  width: 450px; height: 450px; background: var(--purple);
  bottom: -100px; right: -100px;
  animation: orbFloat2 25s ease-in-out infinite;
}
.bg-orb-3 {
  width: 350px; height: 350px; background: var(--cyan);
  top: 45%; left: 50%; transform: translate(-50%, -50%);
  animation: orbFloat3 18s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(120px,80px); }
  66% { transform: translate(-60px,150px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,-60px); }
  66% { transform: translate(50px,-120px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.3); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 8%; animation-duration: 14s; animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 12s; animation-delay: 4s; }
.particle:nth-child(4) { left: 52%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 68%; animation-duration: 13s; animation-delay: 3s; }
.particle:nth-child(6) { left: 82%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(7) { left: 92%; animation-duration: 11s; animation-delay: 7s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 100px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2;
  opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-tr {
  top: 60px; right: 60px;
  border-top: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}
.corner-bl {
  bottom: 240px; left: 60px;
  border-bottom: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

/* === Floating Light Points === */
.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 15%; left: 10%; width: 8px; height: 8px;
  background: var(--cyan); box-shadow: 0 0 24px var(--cyan);
}
.light-dot-2 {
  top: 30%; right: 15%; width: 6px; height: 6px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}
.light-dot-3 {
  bottom: 28%; left: 18%; width: 5px; height: 5px;
  background: var(--cyan); box-shadow: 0 0 18px var(--cyan);
}
.light-dot-4 {
  bottom: 35%; right: 10%; width: 7px; height: 7px;
  background: #FFD700; box-shadow: 0 0 22px #FFD700;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* === Glass Card === */
.glass-card {
  background: rgba(10, 20, 40, 0.55);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 32px;
  padding: 72px 60px;
  width: 880px;
  position: relative;
  overflow: hidden;
  opacity: 0;
}
.glass-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
}
.glass-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
}

/* === Intro Label === */
.intro-label {
  font-size: 28px; font-weight: 600;
  color: var(--cyan);
  letter-spacing: 8px;
  text-transform: uppercase;
  margin-bottom: 48px;
  opacity: 0;
  text-align: center;
}

/* === Main Title === */
.main-title {
  font-size: 128px;
  font-weight: bold;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #00D4FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 12px;
  line-height: 1.2;
  text-align: center;
  opacity: 0;
  filter: drop-shadow(0 0 30px rgba(0,212,255,0.3));
}

/* === Divider === */
.divider {
  width: 200px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  margin: 40px auto;
  opacity: 0;
}

/* === Subtitle === */
.subtitle {
  font-size: 44px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  letter-spacing: 4px;
  line-height: 1.6;
  opacity: 0;
}
.subtitle .repo {
  color: var(--cyan);
  font-weight: bold;
}
.subtitle .stars {
  color: #FFD700;
}

/* === Glow Ring === */
.glow-ring {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.1);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  animation: pulseRing 3s ease-in-out infinite;
}
@keyframes pulseRing {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.15; }
  50% { transform: translate(-50%,-50%) scale(1.15); opacity: 0.05; }
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<!-- L-Corner Decorations -->
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-tr" data-el="corner-tr"></div>
<div class="corner corner-bl" data-el="corner-bl"></div>
<div class="corner corner-br" data-el="corner-br"></div>

<!-- Floating Light Points -->
<div class="light-dot light-dot-1" data-el="dot1" style="animation: float 3s ease-in-out infinite;"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation: float 4s ease-in-out infinite reverse;"></div>
<div class="light-dot light-dot-3" data-el="dot3" style="animation: float 3.5s ease-in-out infinite;"></div>
<div class="light-dot light-dot-4" data-el="dot4" style="animation: float 4.5s ease-in-out infinite reverse;"></div>

<!-- Content -->
<div class="content">
  <div class="glass-card" data-el="card">
    <div class="glow-ring"></div>
    <div class="intro-label" data-el="label">WEEKLY PICK</div>
    <div class="main-title" data-el="title">本周推荐</div>
    <div class="divider" data-el="divider"></div>
    <div class="subtitle" data-el="subtitle">
      <span class="repo">shadcn/improve</span> · <span class="stars">2500 Stars</span>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    const card = document.querySelector('[data-el="card"]');
    const label = document.querySelector('[data-el="label"]');
    const title = document.querySelector('[data-el="title"]');
    const divider = document.querySelector('[data-el="divider"]');
    const subtitle = document.querySelector('[data-el="subtitle"]');
    const cornerTL = document.querySelector('[data-el="corner-tl"]');
    const cornerTR = document.querySelector('[data-el="corner-tr"]');
    const cornerBL = document.querySelector('[data-el="corner-bl"]');
    const cornerBR = document.querySelector('[data-el="corner-br"]');
    const dot1 = document.querySelector('[data-el="dot1"]');
    const dot2 = document.querySelector('[data-el="dot2"]');
    const dot3 = document.querySelector('[data-el="dot3"]');
    const dot4 = document.querySelector('[data-el="dot4"]');

    // Glass card entrance
    reveal(card, t, { start: 0.1, duration: 0.8, y: 80, scale: 0.92, blur: 20 });

    // Label
    reveal(label, t, { start: 0.5, duration: 0.5, y: 20, blur: 8 });

    // Main title - dramatic entrance
    reveal(title, t, { start: 0.8, duration: 0.7, y: 40, scale: 0.9, blur: 16 });

    // Divider
    reveal(divider, t, { start: 1.3, duration: 0.4, x: 0, y: 0, scale: 0.5, blur: 6 });

    // Subtitle
    reveal(subtitle, t, { start: 1.6, duration: 0.6, y: 25, blur: 10 });

    // Corners
    cornerTL.style.opacity = easeOutQuart(progress(t, 0.2, 0.5));
    cornerTR.style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    cornerBL.style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    cornerBR.style.opacity = easeOutQuart(progress(t, 0.5, 0.5));

    // Light dots
    dot1.style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    dot2.style.opacity = easeOutQuart(progress(t, 0.5, 0.5));
    dot3.style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
    dot4.style.opacity = easeOutQuart(progress(t, 0.7, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 4.56;
  window.__mode2Ready = true;

  // Auto-run for preview
  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) {
    autoRun = false;
    _origSeekTo(t);
  };
  function animate() {
    if (!autoRun) return;
    const elapsed = (performance.now() - startTime) / 1000;
    _origSeekTo(Math.min(elapsed, 4.56));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
