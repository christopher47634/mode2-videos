<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'InterDisplay';
  src: url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');
  font-weight: bold; font-style: normal;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc');
  font-weight: bold;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1080px; height:1920px; overflow:hidden;
  background:#06101F; font-family:'NotoSansCJK',sans-serif;
}
.scene { position:relative; width:1080px; height:1920px; overflow:hidden; background:#06101F; }
.bg-orbs { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0; }
.orb-1 { width:500px; height:500px; top:300px; left:-100px; background:radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%); }
.orb-2 { width:450px; height:450px; top:900px; right:-150px; background:radial-gradient(circle, rgba(52,199,89,0.08), transparent 70%); }
.scanlines { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0;
  background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px); }
.scan-beam { position:absolute; left:0; width:100%; height:200px;
  background:linear-gradient(180deg, transparent, rgba(0,212,255,0.04), transparent);
  top:-200px; pointer-events:none; z-index:1; }

.content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:0 80px; }
.title { font-family:'InterDisplay','NotoSansCJK',sans-serif; font-size:80px; color:#A2AAAD; text-align:center; opacity:0;
  text-shadow:0 0 40px rgba(0,212,255,0.2); margin-bottom:120px; }

/* 流程图 */
.flow-row { display:flex; align-items:center; justify-content:center; gap:40px; width:100%; }
.flow-box { padding:30px 40px; border-radius:16px; font-size:36px; color:#A2AAAD;
  background:rgba(255,255,255,0.03); border:1px solid rgba(0,212,255,0.15);
  backdrop-filter:blur(20px); text-align:center; opacity:0; }
.flow-box .emoji { font-size:80px; display:block; margin-bottom:15px; }
.flow-arrow { font-size:60px; color:#00D4FF; opacity:0; }

.bottom-text { font-family:'NotoSansCJK',sans-serif; font-size:44px; color:#34C759;
  text-align:center; margin-top:100px; opacity:0; }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-orbs">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
  </div>
  <div class="scanlines" id="scanlines"></div>
  <div class="scan-beam" id="scanBeam"></div>
  <div class="content">
    <div class="title" id="title">OCI兼容</div>
    <div class="flow-row">
      <div class="flow-box" id="boxDocker">
        <span class="emoji">🐳</span>Docker Hub
      </div>
      <div class="flow-arrow" id="arrow1">→</div>
      <div class="flow-box" id="boxArrow">
        <span class="emoji">📦</span>镜像
      </div>
      <div class="flow-arrow" id="arrow2">→</div>
      <div class="flow-box" id="boxContainer">
        <span class="emoji">🍎</span>container
      </div>
    </div>
    <div class="bottom-text" id="bottomText">直接拉过来用</div>
  </div>
</div>

<script>
window.__mode2Duration = 4.32;
window.__mode2Ready = true;

function progress(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return Math.max(0, Math.min(1, (t - start) / dur));
}
function mix(a, b, t) { return a + (b - a) * t; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { var s=1.7; return 1+(--t)*t*((s+1)*t+s); }

function seekTo(t) {
  // 背景
  var op = easeOutQuart(progress(t, 0, 0.6));
  document.getElementById('orb1').style.opacity = op * 0.5;
  document.getElementById('orb1').style.transform = 'translate(' + Math.sin(t*0.3)*30 + 'px,' + Math.cos(t*0.2)*20 + 'px)';
  document.getElementById('orb2').style.opacity = op * 0.4;
  document.getElementById('orb2').style.transform = 'translate(' + Math.cos(t*0.25)*25 + 'px,' + Math.sin(t*0.35)*15 + 'px)';
  document.getElementById('scanlines').style.opacity = op * 0.5;
  var beamY = ((t*200) % 2200) - 200;
  document.getElementById('scanBeam').style.transform = 'translateY(' + beamY + 'px)';
  document.getElementById('scanBeam').style.opacity = 0.6;

  // 标题
  var titleP = easeOutQuart(progress(t, 0.2, 0.8));
  document.getElementById('title').style.opacity = titleP;
  document.getElementById('title').style.transform = 'translateY(' + mix(40,0,titleP) + 'px)';

  // Docker Hub盒子
  var box1P = easeOutBack(progress(t, 0.8, 0.6));
  var box1 = document.getElementById('boxDocker');
  box1.style.opacity = box1P;
  box1.style.transform = 'translateX(' + mix(-200,0,box1P) + 'px) scale(' + mix(0.5,1,box1P) + ')';

  // 箭头1
  var a1P = easeOutQuart(progress(t, 1.3, 0.4));
  var a1 = document.getElementById('arrow1');
  a1.style.opacity = a1P;
  a1.style.transform = 'scale(' + mix(0,1,a1P) + ')';

  // 镜像盒子
  var box2P = easeOutBack(progress(t, 1.5, 0.6));
  var box2 = document.getElementById('boxArrow');
  box2.style.opacity = box2P;
  box2.style.transform = 'translateY(' + mix(50,0,box2P) + 'px) scale(' + mix(0.5,1,box2P) + ')';

  // 箭头2
  var a2P = easeOutQuart(progress(t, 2.0, 0.4));
  var a2 = document.getElementById('arrow2');
  a2.style.opacity = a2P;
  a2.style.transform = 'scale(' + mix(0,1,a2P) + ')';

  // container盒子
  var box3P = easeOutBack(progress(t, 2.2, 0.6));
  var box3 = document.getElementById('boxContainer');
  box3.style.opacity = box3P;
  box3.style.transform = 'translateX(' + mix(200,0,box3P) + 'px) scale(' + mix(0.5,1,box3P) + ')';

  // 底部文字滑入
  var botP = easeOutQuart(progress(t, 3.0, 0.8));
  var botEl = document.getElementById('bottomText');
  botEl.style.opacity = botP;
  botEl.style.transform = 'translateY(' + mix(60,0,botP) + 'px)';
}
seekTo(0);
</script>
</body>
</html>
