<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 1 - MiMoCode 项目介绍</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 600px; height: 600px; background: var(--blue);
  top: -150px; left: -150px;
  animation: orbFloat1 20s ease-in-out infinite;
}
.bg-orb-2 {
  width: 450px; height: 450px; background: var(--purple);
  bottom: -100px; right: -100px;
  animation: orbFloat2 25s ease-in-out infinite;
}
.bg-orb-3 {
  width: 350px; height: 350px; background: var(--cyan);
  top: 45%; left: 50%; transform: translate(-50%, -50%);
  animation: orbFloat3 18s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(120px,80px); }
  66% { transform: translate(-60px,150px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,-60px); }
  66% { transform: translate(50px,-120px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.3); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 8%; animation-duration: 14s; animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 12s; animation-delay: 4s; }
.particle:nth-child(4) { left: 52%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 68%; animation-duration: 13s; animation-delay: 3s; }
.particle:nth-child(6) { left: 82%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(7) { left: 92%; animation-duration: 11s; animation-delay: 7s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 100px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2;
  opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

/* === Floating Light Points === */
.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 12%; left: 8%; width: 6px; height: 6px;
  background: var(--cyan); box-shadow: 0 0 20px var(--cyan);
}
.light-dot-2 {
  bottom: 22%; right: 12%; width: 8px; height: 8px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}

/* === Glass Card === */
.glass-card {
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 24px;
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}

/* === Section Header === */
.section-label {
  font-size: 28px; font-weight: 600;
  color: var(--cyan);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin-bottom: 40px;
  opacity: 0;
}

/* === GitHub Screenshot Frame === */
.screenshot-frame {
  width: 900px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(0,212,255,0.15);
  box-shadow: 0 20px 80px rgba(0,0,0,0.5), 0 0 60px rgba(0,212,255,0.08);
  position: relative;
  opacity: 0;
}
.screenshot-frame img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  object-position: top center;
  max-height: 500px;
}
.screenshot-frame::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(transparent, var(--bg));
  pointer-events: none;
}
.browser-bar {
  height: 44px;
  background: rgba(13,17,23,0.95);
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.browser-dot {
  width: 12px; height: 12px; border-radius: 50%;
}
.browser-dot.r { background: #FF5F56; }
.browser-dot.y { background: #FFBD2E; }
.browser-dot.g { background: #27C93F; }
.browser-url {
  flex: 1; margin-left: 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px; padding: 6px 16px;
  font-size: 18px; color: var(--text-dim);
  font-family: monospace;
}

/* === Project Info === */
.project-info {
  text-align: center;
  margin-top: 48px;
  opacity: 0;
}
.project-name {
  font-size: 120px;
  font-weight: bold;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #6B3FA0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 8px;
  line-height: 1.1;
}
.project-desc {
  font-size: 42px;
  color: var(--text);
  margin-top: 20px;
  text-align: center;
  line-height: 1.6;
}
.project-desc .highlight {
  color: var(--cyan);
  font-weight: bold;
}
.project-author {
  font-size: 36px;
  color: var(--text-dim);
  margin-top: 16px;
}
.project-author span {
  color: var(--cyan);
}

/* === Badge Row === */
.badge-row {
  display: flex; gap: 20px; justify-content: center;
  margin-top: 36px;
  opacity: 0;
}
.badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 40px;
  padding: 14px 28px;
  font-size: 28px; font-weight: 600;
}
.badge .icon { font-size: 24px; }
.badge-stars { color: #FFD700; }
.badge-lang { color: var(--cyan); }
.badge-license { color: #8B5CF6; }

/* === Description === */
.description {
  margin-top: 40px;
  font-size: 42px;
  color: var(--text);
  text-align: center;
  line-height: 1.6;
  opacity: 0;
}
.description .highlight {
  color: var(--cyan);
  font-weight: bold;
}
.description .gold {
  color: #FFD700;
}
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<!-- L-Corner Decorations -->
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>

<!-- Floating Light Points -->
<div class="light-dot light-dot-1" data-el="dot1" style="animation: float 3s ease-in-out infinite;"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation: float 4s ease-in-out infinite reverse;"></div>

<!-- Content -->
<div class="content">
  <div class="section-label" data-el="label">GITHUB · PROJECT</div>

  <!-- GitHub Screenshot -->
  <div class="screenshot-frame" data-el="screenshot">
    <div class="browser-bar">
      <div class="browser-dot r"></div>
      <div class="browser-dot y"></div>
      <div class="browser-dot g"></div>
      <div class="browser-url">github.com/XiaomiMiMo/MiMo-Code</div>
    </div>
    <img src="github_screenshot.png" alt="GitHub MiMo-Code repository">
  </div>

  <!-- Project Info -->
  <div class="project-info" data-el="info">
    <div class="project-name">MiMoCode</div>
    <div class="project-author"><span>小米MiMo团队</span> · 3天7400星</div>
  </div>

  <!-- Badges -->
  <div class="badge-row" data-el="badges">
    <div class="badge badge-lang">
      <span class="icon">◆</span>
      <span>TypeScript</span>
    </div>
    <div class="badge badge-license">
      <span class="icon">◈</span>
      <span>MIT</span>
    </div>
    <div class="badge badge-stars">
      <span class="icon">★</span>
      <span>7.4K Stars</span>
    </div>
  </div>

  <!-- Description -->
  <div class="description" data-el="desc">
    <span class="highlight">终端原生AI编程助手</span>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    const label = document.querySelector('[data-el="label"]');
    const screenshot = document.querySelector('[data-el="screenshot"]');
    const info = document.querySelector('[data-el="info"]');
    const badges = document.querySelector('[data-el="badges"]');
    const desc = document.querySelector('[data-el="desc"]');
    const cornerTL = document.querySelector('[data-el="corner-tl"]');
    const cornerBR = document.querySelector('[data-el="corner-br"]');
    const dot1 = document.querySelector('[data-el="dot1"]');
    const dot2 = document.querySelector('[data-el="dot2"]');

    reveal(label, t, { start: 0.2, duration: 0.5, y: 20, blur: 8 });
    reveal(screenshot, t, { start: 0.4, duration: 0.8, y: 60, scale: 0.95, blur: 16 });
    reveal(info, t, { start: 1.2, duration: 0.7, y: 30, blur: 10 });
    reveal(badges, t, { start: 1.8, duration: 0.6, y: 25, scale: 0.92, blur: 8 });
    reveal(desc, t, { start: 2.4, duration: 0.6, y: 20, blur: 6 });

    // Corners
    const cp = easeOutQuart(progress(t, 0.3, 0.5));
    cornerTL.style.opacity = cp;
    cornerBR.style.opacity = easeOutQuart(progress(t, 0.5, 0.5));

    // Light dots
    dot1.style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    dot2.style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 6;
  window.__mode2Ready = true;

  // Auto-run for preview
  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) {
    autoRun = false;
    _origSeekTo(t);
  };
  function animate() {
    if (!autoRun) return;
    const elapsed = (performance.now() - startTime) / 1000;
    _origSeekTo(Math.min(elapsed, 6));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
