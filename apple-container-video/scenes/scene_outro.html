<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'InterDisplay';
  src: url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');
  font-weight: bold; font-style: normal;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc');
  font-weight: bold;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1080px; height:1920px; overflow:hidden;
  background:#06101F; font-family:'NotoSansCJK',sans-serif;
}
.scene { position:relative; width:1080px; height:1920px; overflow:hidden; background:#06101F; }
.bg-orbs { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0; }
.orb-1 { width:600px; height:600px; top:300px; left:200px; background:radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%); }
.orb-2 { width:400px; height:400px; top:900px; right:100px; background:radial-gradient(circle, rgba(52,199,89,0.1), transparent 70%); }
.scanlines { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0;
  background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px); }
.scan-beam { position:absolute; left:0; width:100%; height:200px;
  background:linear-gradient(180deg, transparent, rgba(0,212,255,0.04), transparent);
  top:-200px; pointer-events:none; z-index:1; }

.content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:0 80px; }

/* 金句 */
.quote {
  font-family: 'InterDisplay', 'NotoSansCJK', sans-serif;
  font-size: 96px; color: #A2AAAD;
  text-align: center; opacity: 0;
  text-shadow: 0 0 60px rgba(0,212,255,0.3), 0 0 120px rgba(0,212,255,0.1);
  line-height: 1.4;
}
.cursor {
  display: inline-block; width: 5px; height: 90px;
  background: #00D4FF; margin-left: 10px;
  vertical-align: middle; opacity: 0;
}

/* 装饰线 */
.deco-line {
  width: 0; height: 2px; margin-top: 80px;
  background: linear-gradient(90deg, transparent, #00D4FF, transparent);
  opacity: 0;
}

/* URL */
.url {
  font-family: 'Courier New', monospace;
  font-size: 40px; color: #00D4FF;
  text-align: center; margin-top: 60px;
  opacity: 0; letter-spacing: 2px;
}

/* 底部装饰 */
.bottom-glow {
  position: absolute; bottom: 200px; left: 50%;
  transform: translateX(-50%);
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,212,255,0.08), transparent 70%);
  filter: blur(60px); opacity: 0;
}
</style>
</head>
<body>
<div class="scene">
  <div class="bg-orbs">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
  </div>
  <div class="scanlines" id="scanlines"></div>
  <div class="scan-beam" id="scanBeam"></div>
  <div class="bottom-glow" id="bottomGlow"></div>
  <div class="content">
    <div class="quote" id="quote">苹果这波，优雅。<span class="cursor" id="cursor">|</span></div>
    <div class="deco-line" id="decoLine"></div>
    <div class="url" id="url">github.com/apple/container</div>
  </div>
</div>

<script>
window.__mode2Duration = 3.0;
window.__mode2Ready = true;

function progress(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return Math.max(0, Math.min(1, (t - start) / dur));
}
function mix(a, b, t) { return a + (b - a) * t; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

var quoteText = '苹果这波，优雅。';

function seekTo(t) {
  // 背景
  var op = easeOutQuart(progress(t, 0, 0.5));
  document.getElementById('orb1').style.opacity = op * 0.6;
  document.getElementById('orb1').style.transform = 'translate(' + Math.sin(t*0.3)*30 + 'px,' + Math.cos(t*0.2)*20 + 'px)';
  document.getElementById('orb2').style.opacity = op * 0.5;
  document.getElementById('orb2').style.transform = 'translate(' + Math.cos(t*0.25)*25 + 'px,' + Math.sin(t*0.35)*15 + 'px)';
  document.getElementById('scanlines').style.opacity = op * 0.5;
  var beamY = ((t*200) % 2200) - 200;
  document.getElementById('scanBeam').style.transform = 'translateY(' + beamY + 'px)';
  document.getElementById('scanBeam').style.opacity = 0.6;

  // 底部光晕
  var glowP = easeOutQuart(progress(t, 0.5, 1.0));
  document.getElementById('bottomGlow').style.opacity = glowP * 0.5;

  // 金句打字机
  var quoteP = progress(t, 0.3, 1.2);
  var quoteEl = document.getElementById('quote');
  var chars = Math.floor(quoteP * quoteText.length);
  // 保留cursor span
  quoteEl.innerHTML = quoteText.substring(0, chars) + '<span class="cursor" id="cursor">|</span>';
  quoteEl.style.opacity = chars > 0 ? 1 : 0;
  var scale = easeOutQuart(progress(t, 0.3, 0.5));
  quoteEl.style.transform = 'scale(' + mix(0.9, 1.0, scale) + ')';

  // 光标闪烁
  var cursorEl = document.getElementById('cursor');
  if (cursorEl) {
    var blink = Math.sin(t * 8) > 0 ? 1 : 0.2;
    cursorEl.style.opacity = quoteP < 1 ? blink : 0;
  }

  // 装饰线
  var lineP = easeOutCubic(progress(t, 1.6, 0.5));
  document.getElementById('decoLine').style.opacity = lineP * 0.5;
  document.getElementById('decoLine').style.width = (lineP * 300) + 'px';

  // URL淡入
  var urlP = easeOutQuart(progress(t, 2.0, 0.8));
  var urlEl = document.getElementById('url');
  urlEl.style.opacity = urlP;
  urlEl.style.transform = 'translateY(' + mix(30, 0, urlP) + 'px)';
}
seekTo(0);
</script>
</body>
</html>
