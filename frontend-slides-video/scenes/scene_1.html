<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'InterDisplay';src:url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');font-weight:bold;font-style:normal;}
@font-face{font-family:'Inter';src:url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');font-weight:bold;font-style:normal;}
@font-face{font-family:'NotoSansCJK';src:url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');font-weight:bold;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;background:#1A1B26;overflow:hidden;position:relative;}
.bg-glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.3;pointer-events:none;}
.glow1{width:500px;height:500px;background:#7AA2F7;top:200px;right:-100px;}
.glow2{width:400px;height:400px;background:#BB9AF7;bottom:200px;left:-50px;}
.scanline{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(122,162,247,0.03) 4px,rgba(122,162,247,0.03) 5px);pointer-events:none;z-index:1;}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;}
.title{position:absolute;top:280px;width:100%;text-align:center;font-family:'InterDisplay',sans-serif;font-size:96px;color:#E0AF68;}
.vs-card{position:absolute;top:500px;width:380px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;}
.old-card{left:80px;background:rgba(224,175,104,0.08);border:1px solid rgba(224,175,104,0.2);}
.new-card{right:80px;background:rgba(122,162,247,0.08);border:1px solid rgba(122,162,247,0.2);}
.vs-icon{font-size:120px;margin-bottom:30px;}
.vs-label{font-family:'InterDisplay',sans-serif;font-size:48px;color:rgba(255,255,255,0.8);}
.vs-tag{font-family:'Inter','NotoSansCJK',sans-serif;font-size:32px;margin-top:16px;padding:8px 24px;border-radius:20px;}
.old-tag{color:#E0AF68;background:rgba(224,175,104,0.15);}
.new-tag{color:#9ECE6A;background:rgba(158,206,106,0.15);}
.vs-text{position:absolute;top:720px;left:50%;transform:translateX(-50%);font-family:'InterDisplay',sans-serif;font-size:64px;color:#BB9AF7;}
.bottom{position:absolute;bottom:200px;width:100%;text-align:center;font-family:'NotoSansCJK','Inter',sans-serif;font-size:42px;color:rgba(255,255,255,0.6);}
</style>
</head><body>
<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="scanline"></div>
<div id="title" class="title">告别PowerPoint</div>
<div id="oldCard" class="vs-card old-card glass">
  <div class="vs-icon">📊</div>
  <div class="vs-label">PowerPoint</div>
  <div class="vs-tag old-tag">❌ 传统演示</div>
</div>
<div id="vsText" class="vs-text">VS</div>
<div id="newCard" class="vs-card new-card glass">
  <div class="vs-icon">💻</div>
  <div class="vs-label">HTML 演示</div>
  <div class="vs-tag new-tag">✓ 全新时代</div>
</div>
<div id="bottom" class="bottom">纯HTML零依赖</div>
<script>
window.__mode2Duration=4.37;
function seekTo(t){
  var dur=4.37;
  var title=document.getElementById('title');
  var oldCard=document.getElementById('oldCard');
  var newCard=document.getElementById('newCard');
  var vsText=document.getElementById('vsText');
  var bottom=document.getElementById('bottom');
  // Title fade in 0-0.6
  var tp=Math.min(Math.max(t/0.6,0),1);
  title.style.opacity=tp;
  title.style.transform='translateY('+(40-40*tp)+'px)';
  // Old card slides in from left 0.4-1.2
  var op=Math.min(Math.max((t-0.4)/0.8,0),1);
  oldCard.style.transform='translateX('+(-400+400*op)+'px)';
  oldCard.style.opacity=op;
  // VS text pop 0.8-1.0
  var vp=Math.min(Math.max((t-0.8)/0.3,0),1);
  vsText.style.transform='translateX(-50%) scale('+(0.3+0.7*vp)+')';
  vsText.style.opacity=vp;
  // New card slides in from right 1.0-1.8
  var np=Math.min(Math.max((t-1.0)/0.8,0),1);
  newCard.style.transform='translateX('+(400-400*np)+'px)';
  newCard.style.opacity=np;
  // Bottom text 2.5-3.5
  var bp=Math.min(Math.max((t-2.5)/0.6,0),1);
  bottom.style.opacity=bp;
  bottom.style.transform='translateY('+(30-30*bp)+'px)';
  // Old card X shake at 2.0
  if(t>2.0&&t<2.4){
    var shake=Math.sin((t-2.0)*30)*8*(1-(t-2.0)/0.4);
    oldCard.style.transform='translateX('+shake+'px)';
  }
}
window.__mode2Ready=true;
seekTo(0);
</script>
</body></html>
