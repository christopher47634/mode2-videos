<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 2 - 九大类并行审计</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 { width: 600px; height: 600px; background: var(--blue); top: -150px; left: -150px; animation: orbFloat1 20s ease-in-out infinite; }
.bg-orb-2 { width: 450px; height: 450px; background: var(--purple); bottom: -100px; right: -100px; animation: orbFloat2 25s ease-in-out infinite; }
.bg-orb-3 { width: 350px; height: 350px; background: var(--cyan); top: 45%; left: 50%; transform: translate(-50%, -50%); animation: orbFloat3 18s ease-in-out infinite; }
@keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(120px,80px)} 66%{transform:translate(-60px,150px)} }
@keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-100px,-60px)} 66%{transform:translate(50px,-120px)} }
@keyframes orbFloat3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

.particles { position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden; }
.particle { position:absolute;width:3px;height:3px;background:var(--cyan);border-radius:50%;opacity:0;animation:particleRise linear infinite; }
.particle:nth-child(1){left:8%;animation-duration:14s}
.particle:nth-child(2){left:22%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:38%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:52%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:68%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:82%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:92%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise { 0%{transform:translateY(1920px);opacity:0} 10%{opacity:.6} 90%{opacity:.6} 100%{transform:translateY(-20px);opacity:0} }

.scanline { position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.12;z-index:0;animation:scanDown 8s linear infinite; }
@keyframes scanDown { 0%{top:-2px} 100%{top:1920px} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.content { position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:100px 80px 180px 80px;height:100%; }

.corner { position:absolute;width:50px;height:50px;z-index:2;opacity:0; }
.corner-tl { top:60px;left:60px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan); }
.corner-br { bottom:240px;right:60px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan); }

.light-dot { position:absolute;border-radius:50%;z-index:2;opacity:0; }
.light-dot-1 { top:12%;left:8%;width:6px;height:6px;background:var(--cyan);box-shadow:0 0 20px var(--cyan); }
.light-dot-2 { bottom:22%;right:12%;width:8px;height:8px;background:var(--purple);box-shadow:0 0 20px var(--purple); }

.title {
  font-size: 72px; font-weight: bold; text-align: center; margin-bottom: 56px;
  background: linear-gradient(135deg, #00D4FF, #0099FF);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  opacity: 0;
}

.audit-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 24px; width: 100%; max-width: 920px;
}
.audit-card {
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 20px; padding: 32px 20px;
  text-align: center; position: relative; overflow: hidden;
  opacity: 0;
}
.audit-card::before {
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent);
}
.audit-card .icon-wrap {
  width: 60px; height: 60px; margin: 0 auto 14px;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
}
.audit-card .icon-wrap svg { width: 30px; height: 30px; }
.audit-card .card-label { font-size: 28px; font-weight: bold; color: var(--text); letter-spacing: 1px; }

.icon-correctness { background: rgba(34,197,94,0.15); color: #22C55E; }
.icon-security { background: rgba(239,68,68,0.15); color: #EF4444; }
.icon-perf { background: rgba(251,191,36,0.15); color: #FBBF24; }
.icon-tests { background: rgba(96,165,250,0.15); color: #60A5FA; }
.icon-techdebt { background: rgba(168,85,247,0.15); color: #A855F7; }
.icon-deps { background: rgba(236,72,153,0.15); color: #EC4899; }
.icon-dx { background: rgba(20,184,166,0.15); color: #14B8A6; }
.icon-docs { background: rgba(251,146,60,0.15); color: #FB923C; }
.icon-direction { background: rgba(0,212,255,0.15); color: #00D4FF; }

.tagline {
  margin-top: 52px; font-size: 44px; color: var(--text-dim); text-align: center;
  opacity: 0;
}
.tagline .hl { color: var(--cyan); font-weight: bold; }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div>
</div>
<div class="scanline"></div>

<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">九大类并行扫描</div>

  <div class="audit-grid">
    <div class="audit-card" data-el="card-0">
      <div class="icon-wrap icon-correctness"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
      <div class="card-label">Correctness</div>
    </div>
    <div class="audit-card" data-el="card-1">
      <div class="icon-wrap icon-security"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="card-label">Security</div>
    </div>
    <div class="audit-card" data-el="card-2">
      <div class="icon-wrap icon-perf"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <div class="card-label">Perf</div>
    </div>
    <div class="audit-card" data-el="card-3">
      <div class="icon-wrap icon-tests"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16.5h10"/></svg></div>
      <div class="card-label">Tests</div>
    </div>
    <div class="audit-card" data-el="card-4">
      <div class="icon-wrap icon-techdebt"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
      <div class="card-label">Tech Debt</div>
    </div>
    <div class="audit-card" data-el="card-5">
      <div class="icon-wrap icon-deps"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div>
      <div class="card-label">Deps</div>
    </div>
    <div class="audit-card" data-el="card-6">
      <div class="icon-wrap icon-dx"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
      <div class="card-label">DX</div>
    </div>
    <div class="audit-card" data-el="card-7">
      <div class="icon-wrap icon-docs"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
      <div class="card-label">Docs</div>
    </div>
    <div class="audit-card" data-el="card-8">
      <div class="icon-wrap icon-direction"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div>
      <div class="card-label">Direction</div>
    </div>
  </div>

  <div class="tagline" data-el="tagline"><span class="hl">一个不漏</span> · 全面审计</div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    const title = document.querySelector('[data-el="title"]');
    const tagline = document.querySelector('[data-el="tagline"]');
    const cornerTL = document.querySelector('[data-el="corner-tl"]');
    const cornerBR = document.querySelector('[data-el="corner-br"]');
    const dot1 = document.querySelector('[data-el="dot1"]');
    const dot2 = document.querySelector('[data-el="dot2"]');

    reveal(title, t, { start: 0.1, duration: 0.6, y: 30, blur: 10 });

    for (let i = 0; i < 9; i++) {
      const card = document.querySelector(`[data-el="card-${i}"]`);
      const row = Math.floor(i / 3);
      const col = i % 3;
      const delay = 0.6 + row * 0.2 + col * 0.15;
      reveal(card, t, { start: delay, duration: 0.55, y: 35, scale: 0.92, blur: 10 });
    }

    reveal(tagline, t, { start: 2.8, duration: 0.6, y: 20, blur: 6 });

    cornerTL.style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    cornerBR.style.opacity = easeOutQuart(progress(t, 0.5, 0.5));
    dot1.style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    dot2.style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 7;
  window.__mode2Ready = true;

  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) { autoRun = false; _origSeekTo(t); };
  function animate() {
    if (!autoRun) return;
    _origSeekTo(Math.min((performance.now() - startTime) / 1000, 7));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
