<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'InterDisplay';
  src: url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');
  font-weight: bold; font-style: normal;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc');
  font-weight: bold;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: #06101F; font-family: 'NotoSansCJK', sans-serif;
}
.scene {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: #06101F;
}

/* 背景光球 */
.bg-orbs {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.orb {
  position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0;
}
.orb-1 {
  width: 500px; height: 500px; top: 300px; left: -100px;
  background: radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%);
}
.orb-2 {
  width: 600px; height: 600px; top: 800px; right: -200px;
  background: radial-gradient(circle, rgba(52,199,89,0.1), transparent 70%);
}

/* 扫描线 */
.scanlines {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; opacity: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px);
}
.scan-beam {
  position: absolute; left: 0; width: 100%; height: 200px;
  background: linear-gradient(180deg, transparent, rgba(0,212,255,0.04), transparent);
  top: -200px; pointer-events: none; z-index: 1;
}

/* 内容 */
.content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; padding: 0 80px;
}

/* 标题 */
.title {
  font-family: 'InterDisplay', 'NotoSansCJK', sans-serif;
  font-size: 80px; color: #A2AAAD;
  text-align: center; opacity: 0;
  text-shadow: 0 0 40px rgba(0,212,255,0.2);
  margin-bottom: 80px;
}

/* VS对比区 */
.vs-area {
  display: flex; align-items: center; justify-content: center;
  gap: 60px; width: 100%;
}
.emoji-icon {
  font-size: 140px; opacity: 0;
}
.vs-text {
  font-family: 'InterDisplay', 'NotoSansCJK', sans-serif;
  font-size: 80px; color: #00D4FF;
  text-shadow: 0 0 30px rgba(0,212,255,0.5);
  opacity: 0;
}

/* 底部文字 */
.bottom-text {
  font-family: 'NotoSansCJK', sans-serif;
  font-size: 42px; color: #A2AAAD;
  text-align: center; margin-top: 100px;
  opacity: 0;
  padding: 30px 50px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,212,255,0.1);
  border-radius: 16px;
  backdrop-filter: blur(20px);
}

/* 装饰 */
.glow-ring {
  position: absolute; top: 50%; left: 50%;
  width: 700px; height: 700px;
  border: 2px solid rgba(0,212,255,0.08);
  border-radius: 50%;
  transform: translate(-50%, -50%); opacity: 0;
}
</style>
</head>
<body>
<div class="scene">
  <div class="bg-orbs">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
  </div>
  <div class="scanlines" id="scanlines"></div>
  <div class="scan-beam" id="scanBeam"></div>
  <div class="glow-ring" id="glowRing"></div>
  <div class="content">
    <div class="title" id="title">苹果终于动手了</div>
    <div class="vs-area">
      <div class="emoji-icon" id="emojiApple">🍎</div>
      <div class="vs-text" id="vsText">VS</div>
      <div class="emoji-icon" id="emojiDocker">🐳</div>
    </div>
    <div class="bottom-text" id="bottomText">刚开源了自己的容器工具</div>
  </div>
</div>

<script>
window.__mode2Duration = 4.17;
window.__mode2Ready = true;

function progress(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return Math.max(0, Math.min(1, (t - start) / dur));
}
function mix(a, b, t) { return a + (b - a) * t; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutBack(t) { var s = 1.7; return 1 + (--t) * t * ((s + 1) * t + s); }
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1;
}

function seekTo(t) {
  // 背景光球
  var op = easeOutQuart(progress(t, 0, 0.6));
  document.getElementById('orb1').style.opacity = op * 0.5;
  document.getElementById('orb1').style.transform = 'translate(' + Math.sin(t * 0.3) * 30 + 'px, ' + Math.cos(t * 0.2) * 20 + 'px)';
  document.getElementById('orb2').style.opacity = op * 0.4;
  document.getElementById('orb2').style.transform = 'translate(' + Math.cos(t * 0.25) * 25 + 'px, ' + Math.sin(t * 0.35) * 15 + 'px)';
  document.getElementById('scanlines').style.opacity = op * 0.5;
  var beamY = ((t * 200) % 2200) - 200;
  document.getElementById('scanBeam').style.transform = 'translateY(' + beamY + 'px)';
  document.getElementById('scanBeam').style.opacity = 0.6;

  // 标题淡入
  var titleP = easeOutQuart(progress(t, 0.2, 0.8));
  var titleEl = document.getElementById('title');
  titleEl.style.opacity = titleP;
  titleEl.style.transform = 'translateY(' + mix(40, 0, titleP) + 'px)';

  // 苹果emoji从左边飞入
  var appleP = easeOutBack(progress(t, 0.6, 0.8));
  var appleEl = document.getElementById('emojiApple');
  appleEl.style.opacity = appleP;
  appleEl.style.transform = 'translateX(' + mix(-400, 0, appleP) + 'px) scale(' + mix(0.3, 1, appleP) + ')';

  // VS弹出
  var vsP = easeOutElastic(progress(t, 1.0, 0.6));
  var vsEl = document.getElementById('vsText');
  vsEl.style.opacity = Math.min(1, vsP * 1.5);
  vsEl.style.transform = 'scale(' + mix(0, 1, vsP) + ') rotate(' + mix(15, 0, vsP) + 'deg)';

  // Docker emoji从右边飞入
  var dockerP = easeOutBack(progress(t, 0.8, 0.8));
  var dockerEl = document.getElementById('emojiDocker');
  dockerEl.style.opacity = dockerP;
  dockerEl.style.transform = 'translateX(' + mix(400, 0, dockerP) + 'px) scale(' + mix(0.3, 1, dockerP) + ')';

  // 底部文字
  var bottomP = easeOutQuart(progress(t, 2.2, 0.8));
  var bottomEl = document.getElementById('bottomText');
  bottomEl.style.opacity = bottomP;
  bottomEl.style.transform = 'translateY(' + mix(40, 0, bottomP) + 'px)';

  // 光环
  var ringP = easeOutQuart(progress(t, 0.5, 1.5));
  var ringEl = document.getElementById('glowRing');
  ringEl.style.opacity = ringP * 0.3;
  ringEl.style.transform = 'translate(-50%, -50%) scale(' + mix(0.5, 1, ringP) + ')';
}
seekTo(0);
</script>
</body>
</html>
