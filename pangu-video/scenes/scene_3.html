<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 3 - Nature论文</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
@font-face { font-family: 'ZCOOL KuaiLe'; src: url('file:///home/chris47634/.fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype'); font-weight: normal; }
:root { --bg:#06101F;--red:#CF0A2C;--blue:#00D4FF;--gold:#FFD700;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
}
.glass-accent {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px rgba(207,10,44,0.1), inset 0 1px 0 rgba(255,255,255,0.15);
}
.glass-badge {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.glass-item {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(120px);opacity:0.06}
.bg-orb-1{width:600px;height:600px;background:var(--gold);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--gold);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:15%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:35%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:55%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:75%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:90%;animation-duration:13s;animation-delay:3s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0.08;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 60px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--gold);box-shadow:0 0 20px var(--gold)}
.light-dot-2{bottom:12%;right:8%;width:8px;height:8px;background:var(--gold);box-shadow:0 0 20px var(--gold)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:72px;font-weight:bold;opacity:0;text-align:center;color:var(--gold);margin-bottom:60px;text-shadow:0 0 40px rgba(255,215,0,0.4);font-family:'ZCOOL KuaiLe',cursive}
.nature-logo{opacity:0;text-align:center;margin-bottom:40px;padding:40px 50px}
.nature-text{font-size:160px;font-weight:bold;color:var(--gold);letter-spacing:8px;text-shadow:0 0 60px rgba(255,215,0,0.3);font-family:'Courier New','NotoSansCJK',monospace}
.nature-sub{font-size:28px;color:var(--text-dim);margin-top:10px;letter-spacing:6px;font-family:'NotoSansCJK',sans-serif;font-weight:bold}
.badge{font-size:44px;font-weight:bold;opacity:0;color:var(--blue);text-align:center;margin-bottom:30px;padding:16px 40px;font-family:'NotoSansCJK',sans-serif}
.desc{font-size:36px;opacity:0;color:var(--text-dim);text-align:center}
.sparkle{position:absolute;font-size:24px;opacity:0}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0.5)}50%{opacity:1;transform:scale(1.2)}}
@keyframes glitchFlash{
  0%,100%{text-shadow:0 0 40px rgba(255,215,0,0.4);transform:translate(0)}
  20%{text-shadow:-3px 0 var(--blue),3px 0 var(--red),0 0 40px rgba(255,215,0,0.4);transform:translate(-2px,1px)}
  40%{text-shadow:3px 0 var(--red),-3px 0 var(--blue),0 0 40px rgba(255,215,0,0.4);transform:translate(2px,-1px)}
  60%{text-shadow:-2px 0 var(--gold),2px 0 var(--blue),0 0 40px rgba(255,215,0,0.4);transform:translate(1px,2px)}
  80%{text-shadow:0 0 40px rgba(255,215,0,0.4);transform:translate(-1px,-1px)}
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 10px rgba(0,212,255,0.3),inset 0 0 10px rgba(0,212,255,0.1);text-shadow:0 0 10px rgba(0,212,255,0.3)}
  50%{box-shadow:0 0 30px rgba(0,212,255,0.6),inset 0 0 20px rgba(0,212,255,0.2);text-shadow:0 0 30px rgba(0,212,255,0.6)}
}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">🏆 登上Nature正刊</div>
  <div class="nature-logo glass-accent" data-el="logo">
    <div class="nature-text">Nature</div>
    <div class="nature-sub">VOLUME · CLIMATE</div>
  </div>
  <div class="badge glass-badge" data-el="badge">秒级全球气象预测</div>
  <div class="desc" data-el="desc">华为盘古气象大模型<br>2023年发表于Nature正刊</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  /* glitch闪烁效果 */
  function glitchReveal(el,time,opts){
    if(!el)return;
    const{start=0,duration=0.5}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform='translate3d(0,'+mix(30,0,p)+'px,0)';
    if(p>0.3&&p<0.95){
      const glitch=Math.random()>0.7;
      if(glitch){
        const dx=(Math.random()-0.5)*6;
        el.style.textShadow=(-dx)+'px 0 var(--blue),'+dx+'px 0 var(--red),0 0 40px rgba(255,215,0,0.4)';
        el.style.transform='translate3d('+dx+'px,'+mix(30,0,p)+'px,0)';
      } else {
        el.style.textShadow='0 0 40px rgba(255,215,0,0.4)';
      }
    } else if(p>=0.95){
      el.style.textShadow='0 0 40px rgba(255,215,0,0.4)';
    }
    el.style.filter='blur('+mix(10,0,p)+'px)';
  }

  /* 数字脉冲发光 */
  function pulseGlowReveal(el,time,opts){
    if(!el)return;
    const{start=0,duration=0.7,scale=0.9,blur=16}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform='translate3d(0,'+mix(40,0,p)+'px,0) scale('+mix(scale,1,p)+')';
    el.style.filter='blur('+mix(blur,0,p)+'px)';
    if(p>0.5){
      const pulse=0.5+0.5*Math.sin((time-start)*6);
      el.style.boxShadow='0 0 '+mix(10,30,pulse)+'px rgba(0,212,255,'+mix(0.3,0.6,pulse)+'),inset 0 0 '+mix(10,20,pulse)+'px rgba(0,212,255,'+mix(0.1,0.2,pulse)+')';
      el.style.textShadow='0 0 '+mix(10,30,pulse)+'px rgba(0,212,255,'+mix(0.3,0.6,pulse)+')';
    }
  }

  /* 通用reveal */
  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    glitchReveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.5});
    pulseGlowReveal(document.querySelector('[data-el="logo"]'),t,{start:0.8,duration:0.7,scale:0.9,blur:16});
    pulseGlowReveal(document.querySelector('[data-el="badge"]'),t,{start:1.8,duration:0.5,scale:0.95,blur:8});
    reveal(document.querySelector('[data-el="desc"]'),t,{start:2.5,duration:0.5,y:20,blur:8});

    document.querySelector('[data-el="corner-tl"]').style.opacity=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=3.95;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,3.95));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
