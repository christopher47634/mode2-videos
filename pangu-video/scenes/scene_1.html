<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 1 - 别人聊天 盘古干活</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
@font-face { font-family: 'ZCOOL KuaiLe'; src: url('file:///home/chris47634/.fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype'); font-weight: normal; }
:root { --bg:#06101F;--red:#CF0A2C;--blue:#00D4FF;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
}
.glass-accent {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px rgba(207,10,44,0.1), inset 0 1px 0 rgba(255,255,255,0.15);
}
.glass-badge {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.glass-item {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(120px);opacity:0.08}
.bg-orb-1{width:600px;height:600px;background:var(--red);top:-150px;left:-150px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:450px;height:450px;background:var(--blue);bottom:-100px;right:-100px;animation:orbFloat2 25s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--blue);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:30%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:50%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:70%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:90%;animation-duration:13s;animation-delay:3s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.5}90%{opacity:0.5}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0.1;z-index:0;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 50px}
.corner{position:absolute;width:60px;height:60px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:2px solid var(--blue);border-left:2px solid var(--blue)}
.corner-br{bottom:60px;right:60px;border-bottom:2px solid var(--red);border-right:2px solid var(--red)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:6px;height:6px;background:var(--blue);box-shadow:0 0 20px var(--blue)}
.light-dot-2{bottom:12%;right:8%;width:8px;height:8px;background:var(--red);box-shadow:0 0 20px var(--red)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-size:72px;font-weight:bold;opacity:0;text-align:center;margin-bottom:80px;text-shadow:0 0 30px rgba(0,212,255,0.3);font-family:'ZCOOL KuaiLe',cursive}
.title .hl{color:var(--red)}
.vs-container{display:flex;gap:30px;width:100%;justify-content:center}
.vs-card{flex:1;padding:36px 28px;opacity:0;position:relative;overflow:hidden}
.vs-label{font-size:28px;color:var(--text-dim);margin-bottom:24px;text-align:center;font-family:'NotoSansCJK',sans-serif;font-weight:bold}
.vs-icon{font-size:80px;text-align:center;margin-bottom:24px}
.vs-items{display:flex;flex-direction:column;gap:16px}
.vs-item{font-size:30px;padding:14px 20px;border-radius:12px;background:rgba(255,255,255,0.04);text-align:center}
.vs-right .vs-item{background:rgba(207,10,44,0.08);color:var(--red)}
.vs-badge{font-size:22px;text-align:center;margin-top:20px;padding:8px 16px;display:inline-block}
.bottom-tag{font-size:36px;opacity:0;color:var(--blue);margin-top:60px;letter-spacing:4px;font-family:'NotoSansCJK',sans-serif;font-weight:bold}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="title" data-el="title">别人聊天 <span class="hl">盘古干活</span></div>
  <div class="vs-container">
    <div class="vs-card vs-left glass" data-el="left">
      <div class="vs-label">通用AI</div>
      <div class="vs-icon">💬</div>
      <div class="vs-items">
        <div class="vs-item">聊天对话</div>
        <div class="vs-item">写诗作文</div>
        <div class="vs-item">编故事</div>
      </div>
      <div class="vs-badge glass-badge">娱乐为主</div>
    </div>
    <div class="vs-card vs-right glass" data-el="right">
      <div class="vs-label">盘古大模型</div>
      <div class="vs-icon">🏭</div>
      <div class="vs-items">
        <div class="vs-item">矿山安全</div>
        <div class="vs-item">气象预测</div>
        <div class="vs-item">药物研发</div>
      </div>
      <div class="vs-badge glass-badge">行业实战</div>
    </div>
  </div>
  <div class="bottom-tag" data-el="tag">不写诗 要干活</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const easeOutBack=t=>{const c1=1.70158;const c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  /* 左卡片从左侧飞入 */
  function slideFromLeft(el,time,opts){
    if(!el)return;
    const{start=0,duration=0.65,x=600,blur=14}=opts;
    const p=easeOutBack(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform='translate3d('+mix(x,0,p)+'px,0,0)';
    el.style.filter='blur('+mix(blur,0,p)+'px)';
  }

  /* 右卡片从右侧飞入 */
  function slideFromRight(el,time,opts){
    if(!el)return;
    const{start=0,duration=0.65,x=600,blur=14}=opts;
    const p=easeOutBack(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform='translate3d('+mix(-x,0,p)+'px,0,0)';
    el.style.filter='blur('+mix(blur,0,p)+'px)';
  }

  /* 通用reveal */
  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="title"]'),t,{start:0.1,duration:0.7,y:40,blur:14});
    slideFromLeft(document.querySelector('[data-el="left"]'),t,{start:1.0,duration:0.65,x:600,blur:12});
    slideFromRight(document.querySelector('[data-el="right"]'),t,{start:1.5,duration:0.65,x:600,blur:12});
    reveal(document.querySelector('[data-el="tag"]'),t,{start:3.5,duration:0.5,y:20,blur:8});

    document.querySelector('[data-el="corner-tl"]').style.opacity=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.4,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.6,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=6.53;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,6.53));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
