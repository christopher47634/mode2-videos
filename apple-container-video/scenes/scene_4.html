<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'InterDisplay';
  src: url('file:///home/chris47634/.fonts/InterDisplay-Bold.otf') format('opentype');
  font-weight: bold; font-style: normal;
}
@font-face {
  font-family: 'Inter';
  src: url('file:///home/chris47634/.fonts/Inter-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc');
  font-weight: bold;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1080px; height:1920px; overflow:hidden;
  background:#06101F; font-family:'NotoSansCJK',sans-serif;
}
.scene { position:relative; width:1080px; height:1920px; overflow:hidden; background:#06101F; }
.bg-orbs { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0; }
.orb-1 { width:500px; height:500px; top:200px; left:-50px; background:radial-gradient(circle, rgba(0,212,255,0.12), transparent 70%); }
.orb-2 { width:400px; height:400px; top:600px; right:-100px; background:radial-gradient(circle, rgba(52,199,89,0.08), transparent 70%); }
.orb-3 { width:350px; height:350px; top:1000px; left:300px; background:radial-gradient(circle, rgba(162,170,173,0.06), transparent 70%); }
.scanlines { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0;
  background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,212,255,0.02) 3px, rgba(0,212,255,0.02) 4px); }
.scan-beam { position:absolute; left:0; width:100%; height:200px;
  background:linear-gradient(180deg, transparent, rgba(0,212,255,0.04), transparent);
  top:-200px; pointer-events:none; z-index:1; }

.content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:0 60px; }
.title { font-family:'InterDisplay','NotoSansCJK',sans-serif; font-size:80px; color:#A2AAAD; text-align:center; opacity:0;
  text-shadow:0 0 40px rgba(0,212,255,0.2); margin-bottom:80px; }

.cards-row { display:flex; flex-direction:column; gap:50px; align-items:center; width:100%; perspective:1000px; }
.glass-card {
  width: 800px; padding: 50px 60px; border-radius: 24px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(0,212,255,0.12);
  backdrop-filter: blur(30px);
  display: flex; align-items: center; gap: 40px;
  opacity: 0;
  transform-origin: center center;
}
.card-emoji { font-size: 80px; flex-shrink: 0; }
.card-text { font-family: 'NotoSansCJK', sans-serif; font-size: 40px; color: #A2AAAD; }
.card-label { font-size: 28px; color: #00D4FF; margin-top: 8px; }

.bottom-text { font-family:'NotoSansCJK',sans-serif; font-size:42px; color:#34C759;
  text-align:center; margin-top:60px; opacity:0; }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-orbs">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>
    <div class="orb orb-3" id="orb3"></div>
  </div>
  <div class="scanlines" id="scanlines"></div>
  <div class="scan-beam" id="scanBeam"></div>
  <div class="content">
    <div class="title" id="title">macOS 26专属</div>
    <div class="cards-row">
      <div class="glass-card" id="card1">
        <div class="card-emoji">🖥️</div>
        <div>
          <div class="card-text">虚拟化</div>
          <div class="card-label">Virtualization.framework</div>
        </div>
      </div>
      <div class="glass-card" id="card2">
        <div class="card-emoji">🌐</div>
        <div>
          <div class="card-text">网络</div>
          <div class="card-label">Network.framework</div>
        </div>
      </div>
      <div class="glass-card" id="card3">
        <div class="card-emoji">⚡</div>
        <div>
          <div class="card-text">性能</div>
          <div class="card-label">Apple Silicon 原生</div>
        </div>
      </div>
    </div>
    <div class="bottom-text" id="bottomText">深度集成系统级</div>
  </div>
</div>

<script>
window.__mode2Duration = 5.54;
window.__mode2Ready = true;

function progress(t, start, dur) {
  if (dur <= 0) return t >= start ? 1 : 0;
  return Math.max(0, Math.min(1, (t - start) / dur));
}
function mix(a, b, t) { return a + (b - a) * t; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutBack(t) { var s=1.7; return 1+(--t)*t*((s+1)*t+s); }

function seekTo(t) {
  // 背景
  var op = easeOutQuart(progress(t, 0, 0.6));
  document.getElementById('orb1').style.opacity = op * 0.5;
  document.getElementById('orb1').style.transform = 'translate(' + Math.sin(t*0.3)*30 + 'px,' + Math.cos(t*0.2)*20 + 'px)';
  document.getElementById('orb2').style.opacity = op * 0.4;
  document.getElementById('orb2').style.transform = 'translate(' + Math.cos(t*0.25)*25 + 'px,' + Math.sin(t*0.35)*15 + 'px)';
  document.getElementById('orb3').style.opacity = op * 0.3;
  document.getElementById('orb3').style.transform = 'translate(' + Math.sin(t*0.4)*20 + 'px,' + Math.cos(t*0.15)*25 + 'px)';
  document.getElementById('scanlines').style.opacity = op * 0.5;
  var beamY = ((t*200) % 2200) - 200;
  document.getElementById('scanBeam').style.transform = 'translateY(' + beamY + 'px)';
  document.getElementById('scanBeam').style.opacity = 0.6;

  // 标题
  var titleP = easeOutQuart(progress(t, 0.2, 0.8));
  document.getElementById('title').style.opacity = titleP;
  document.getElementById('title').style.transform = 'translateY(' + mix(40,0,titleP) + 'px)';

  // 卡片1翻转入场
  var c1P = easeOutBack(progress(t, 0.8, 0.8));
  var c1 = document.getElementById('card1');
  c1.style.opacity = c1P;
  c1.style.transform = 'perspective(1000px) rotateX(' + mix(90,0,c1P) + 'deg) translateY(' + mix(-50,0,c1P) + 'px)';

  // 卡片2翻转入场
  var c2P = easeOutBack(progress(t, 1.4, 0.8));
  var c2 = document.getElementById('card2');
  c2.style.opacity = c2P;
  c2.style.transform = 'perspective(1000px) rotateX(' + mix(90,0,c2P) + 'deg) translateY(' + mix(-50,0,c2P) + 'px)';

  // 卡片3翻转入场
  var c3P = easeOutBack(progress(t, 2.0, 0.8));
  var c3 = document.getElementById('card3');
  c3.style.opacity = c3P;
  c3.style.transform = 'perspective(1000px) rotateX(' + mix(90,0,c3P) + 'deg) translateY(' + mix(-50,0,c3P) + 'px)';

  // 底部文字
  var botP = easeOutQuart(progress(t, 3.5, 1.0));
  var botEl = document.getElementById('bottomText');
  botEl.style.opacity = botP;
  botEl.style.transform = 'translateY(' + mix(40,0,botP) + 'px)';
}
seekTo(0);
</script>
</body>
</html>
