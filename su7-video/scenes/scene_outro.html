<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene Outro - 最快的路</title>
<style>
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype'); font-weight: normal; }
@font-face { font-family: 'NotoSansCJK'; src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype'); font-weight: bold; }
:root { --bg:#06101F;--orange:#FF6900;--red:#E63946;--cyan:#00D4FF;--green:#10B981;--gold:#FFD700;--text:#E8ECF1;--text-dim:rgba(255,255,255,0.5); }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:'NotoSansCJK',sans-serif;color:var(--text);overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(120px);opacity:0.15}
.bg-orb-1{width:700px;height:700px;background:var(--orange);top:-200px;left:-200px;animation:orbFloat1 20s ease-in-out infinite}
.bg-orb-2{width:550px;height:550px;background:var(--red);bottom:-150px;right:-150px;animation:orbFloat2 25s ease-in-out infinite}
.bg-orb-3{width:400px;height:400px;background:var(--orange);top:45%;left:50%;transform:translate(-50%,-50%);animation:orbFloat3 18s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}33%{transform:translate(120px,80px)}66%{transform:translate(-60px,150px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}33%{transform:translate(-100px,-60px)}66%{transform:translate(50px,-120px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--orange);border-radius:50%;opacity:0;animation:particleRise linear infinite}
.particle:nth-child(1){left:10%;animation-duration:14s;animation-delay:0s}
.particle:nth-child(2){left:25%;animation-duration:18s;animation-delay:2s}
.particle:nth-child(3){left:40%;animation-duration:12s;animation-delay:4s}
.particle:nth-child(4){left:55%;animation-duration:16s;animation-delay:1s}
.particle:nth-child(5){left:70%;animation-duration:13s;animation-delay:3s}
.particle:nth-child(6){left:85%;animation-duration:15s;animation-delay:5s}
.particle:nth-child(7){left:95%;animation-duration:11s;animation-delay:7s}
@keyframes particleRise{0%{transform:translateY(1920px);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-20px);opacity:0}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);opacity:0.15;z-index:0;animation:scanDown 6s linear infinite}
@keyframes scanDown{0%{top:-2px}100%{top:1920px}}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:80px 80px}
.corner{position:absolute;width:80px;height:80px;z-index:2;opacity:0}
.corner-tl{top:60px;left:60px;border-top:3px solid var(--orange);border-left:3px solid var(--orange)}
.corner-tr{top:60px;right:60px;border-top:3px solid var(--orange);border-right:3px solid var(--orange)}
.corner-bl{bottom:60px;left:60px;border-bottom:3px solid var(--orange);border-left:3px solid var(--orange)}
.corner-br{bottom:60px;right:60px;border-bottom:3px solid var(--orange);border-right:3px solid var(--orange)}
.light-dot{position:absolute;border-radius:50%;z-index:2;opacity:0}
.light-dot-1{top:12%;left:8%;width:8px;height:8px;background:var(--orange);box-shadow:0 0 25px var(--orange)}
.light-dot-2{bottom:12%;right:12%;width:10px;height:10px;background:var(--red);box-shadow:0 0 25px var(--red)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.quote-main{font-size:100px;font-weight:bold;opacity:0;text-align:center;background:linear-gradient(135deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;margin-bottom:50px}
.quote-sub{font-size:52px;opacity:0;text-align:center;color:var(--text);margin-bottom:80px;line-height:1.4}
.brand{font-size:44px;opacity:0;text-align:center;color:var(--text-dim);letter-spacing:6px}
.brand .accent{color:var(--orange);font-weight:bold}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="particles"><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div></div>
<div class="scanline"></div>
<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-tr" data-el="corner-tr"></div>
<div class="corner corner-bl" data-el="corner-bl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1" style="animation:float 3s ease-in-out infinite"></div>
<div class="light-dot light-dot-2" data-el="dot2" style="animation:float 4s ease-in-out infinite reverse"></div>

<div class="content">
  <div class="quote-main" data-el="main">最快的路</div>
  <div class="quote-sub" data-el="sub">是让质疑者无话可说的路</div>
  <div class="brand" data-el="brand"><span class="accent">小米</span>SU7 Ultra</div>
</div>

<script>
(function() {
  "use strict";
  const clamp=(v,min=0,max=1)=>Math.min(max,Math.max(min,v));
  const mix=(a,b,t)=>a+(b-a)*t;
  const easeOutQuart=t=>1-Math.pow(1-t,4);
  const progress=(time,start,dur)=>clamp((time-start)/Math.max(dur,0.0001));

  function reveal(el,time,opts) {
    if(!el)return;
    const{start=0,duration=0.65,x=0,y=42,scale=0.96,blur=14}=opts;
    const p=easeOutQuart(progress(time,start,duration));
    el.style.opacity=p;
    el.style.transform=`translate3d(${mix(x,0,p)}px,${mix(y,0,p)}px,0) scale(${mix(scale,1,p)})`;
    el.style.filter=`blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    reveal(document.querySelector('[data-el="main"]'),t,{start:0.2,duration:0.8,y:50,scale:0.92,blur:18});
    reveal(document.querySelector('[data-el="sub"]'),t,{start:1.2,duration:0.7,y:40,blur:14});
    reveal(document.querySelector('[data-el="brand"]'),t,{start:2.0,duration:0.6,y:30,blur:10});

    const cp=easeOutQuart(progress(t,0.2,0.4));
    document.querySelector('[data-el="corner-tl"]').style.opacity=cp;
    document.querySelector('[data-el="corner-tr"]').style.opacity=cp;
    document.querySelector('[data-el="corner-bl"]').style.opacity=easeOutQuart(progress(t,0.4,0.4));
    document.querySelector('[data-el="corner-br"]').style.opacity=easeOutQuart(progress(t,0.4,0.4));
    document.querySelector('[data-el="dot1"]').style.opacity=easeOutQuart(progress(t,0.3,0.5));
    document.querySelector('[data-el="dot2"]').style.opacity=easeOutQuart(progress(t,0.5,0.5));
  }
  window.seekTo=seekTo;
  window.__mode2Duration=3.43;
  window.__mode2Ready=true;
  let startTime=performance.now(),autoRun=true;
  let _orig=seekTo;
  window.seekTo=function(t){autoRun=false;_orig(t)};
  function animate(){if(!autoRun)return;const e=(performance.now()-startTime)/1000;_orig(Math.min(e,3.43));requestAnimationFrame(animate)}
  animate();
})();
</script>
</body>
</html>
