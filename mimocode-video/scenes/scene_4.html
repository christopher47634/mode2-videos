<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Scene 4 - Dream & Distill + 三种模式</title>
<style>
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Regular.ttc') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'NotoSansCJK';
  src: url('file:///home/chris47634/.fonts/NotoSansCJK-Bold.ttc') format('truetype');
  font-weight: bold;
}

:root {
  --bg: #06101F;
  --cyan: #00D4FF;
  --blue: #0088CC;
  --purple: #6B3FA0;
  --text: #E8ECF1;
  --text-dim: rgba(255,255,255,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1080px; height: 1920px;
  background: var(--bg);
  font-family: 'NotoSansCJK', 'Noto Sans CJK SC', sans-serif;
  color: var(--text);
  overflow: hidden;
  position: relative;
}

/* === 3-Layer Background === */
.bg-orb {
  position: fixed; border-radius: 50%; pointer-events: none;
  z-index: 0; filter: blur(100px); opacity: 0.1;
}
.bg-orb-1 {
  width: 600px; height: 600px; background: var(--blue);
  top: -150px; left: -150px;
  animation: orbFloat1 20s ease-in-out infinite;
}
.bg-orb-2 {
  width: 450px; height: 450px; background: var(--purple);
  bottom: -100px; right: -100px;
  animation: orbFloat2 25s ease-in-out infinite;
}
.bg-orb-3 {
  width: 350px; height: 350px; background: var(--cyan);
  top: 45%; left: 50%; transform: translate(-50%, -50%);
  animation: orbFloat3 18s ease-in-out infinite;
}
@keyframes orbFloat1 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(120px,80px); }
  66% { transform: translate(-60px,150px); }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0); }
  33% { transform: translate(-100px,-60px); }
  66% { transform: translate(50px,-120px); }
}
@keyframes orbFloat3 {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.3); }
}

.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--cyan); border-radius: 50%; opacity: 0;
  animation: particleRise linear infinite;
}
.particle:nth-child(1) { left: 8%; animation-duration: 14s; animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 12s; animation-delay: 4s; }
.particle:nth-child(4) { left: 52%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 68%; animation-duration: 13s; animation-delay: 3s; }
.particle:nth-child(6) { left: 82%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(7) { left: 92%; animation-duration: 11s; animation-delay: 7s; }
@keyframes particleRise {
  0% { transform: translateY(1920px); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-20px); opacity: 0; }
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.12; z-index: 0;
  animation: scanDown 8s linear infinite;
}
@keyframes scanDown {
  0% { top: -2px; }
  100% { top: 1920px; }
}

/* === Content Layer === */
.content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 100px 80px 180px 80px;
  height: 100%;
}

/* === L-Corner Decorations === */
.corner {
  position: absolute; width: 50px; height: 50px; z-index: 2;
  opacity: 0;
}
.corner-tl {
  top: 60px; left: 60px;
  border-top: 2px solid var(--cyan);
  border-left: 2px solid var(--cyan);
}
.corner-br {
  bottom: 240px; right: 60px;
  border-bottom: 2px solid var(--cyan);
  border-right: 2px solid var(--cyan);
}

.light-dot {
  position: absolute; border-radius: 50%; z-index: 2; opacity: 0;
}
.light-dot-1 {
  top: 12%; left: 8%; width: 6px; height: 6px;
  background: var(--cyan); box-shadow: 0 0 20px var(--cyan);
}
.light-dot-2 {
  bottom: 22%; right: 12%; width: 8px; height: 8px;
  background: var(--purple); box-shadow: 0 0 20px var(--purple);
}

/* === Title === */
.scene-title {
  font-size: 72px;
  font-weight: bold;
  background: linear-gradient(135deg, #00D4FF, #0099FF, #6B3FA0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 6px;
  margin-bottom: 50px;
  opacity: 0;
}

/* === Dream / Distill Cards === */
.dual-cards {
  display: flex;
  gap: 28px;
  width: 100%;
  max-width: 880px;
  margin-bottom: 50px;
}

.dream-card, .distill-card {
  flex: 1;
  background: rgba(10, 20, 40, 0.6);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 24px;
  padding: 40px 36px;
  position: relative;
  overflow: hidden;
  opacity: 0;
}
.dream-card::before, .distill-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.card-icon-wrap {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}

.dream-card .card-icon-wrap {
  background: rgba(139, 92, 246, 0.2);
  color: #A78BFA;
}
.distill-card .card-icon-wrap {
  background: rgba(0, 212, 255, 0.15);
  color: var(--cyan);
}

.card-name {
  font-size: 36px;
  font-weight: bold;
  color: var(--text);
}

.card-flow {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card-flow-step {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 26px;
  color: var(--text-dim);
}

.card-flow-step .arrow {
  color: var(--cyan);
  font-size: 20px;
}

.card-flow-step .result {
  color: var(--cyan);
  font-weight: 600;
}

/* === Section Divider === */
.section-divider {
  width: 100%;
  max-width: 880px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 40px;
  opacity: 0;
}
.section-divider .line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
}
.section-divider .label {
  font-size: 26px;
  color: var(--cyan);
  letter-spacing: 4px;
  font-weight: 600;
}

/* === Mode Tabs === */
.mode-tabs {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 880px;
  margin-bottom: 36px;
  opacity: 0;
}

.mode-tab {
  flex: 1;
  padding: 28px 20px;
  border-radius: 20px;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  border: 1px solid rgba(0, 212, 255, 0.15);
  background: rgba(10, 20, 40, 0.4);
  transition: all 0.3s ease;
  opacity: 0;
}

.mode-tab.active {
  background: rgba(0, 212, 255, 0.12);
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
}

.mode-tab .mode-name {
  font-size: 36px;
  margin-bottom: 8px;
}

.mode-tab .mode-desc {
  font-size: 24px;
  color: var(--text-dim);
  font-weight: normal;
}

/* === Compose Highlight === */
.compose-highlight {
  width: 100%;
  max-width: 880px;
  background: rgba(0, 212, 255, 0.06);
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 20px;
  padding: 32px 40px;
  text-align: center;
  opacity: 0;
}

.compose-highlight .compose-text {
  font-size: 34px;
  color: var(--text);
  line-height: 1.6;
}

.compose-highlight .compose-text .glow {
  color: var(--cyan);
  font-weight: bold;
}

/* === Glow Effects === */
.card-glow {
  position: absolute;
  top: -50%; right: -20%;
  width: 250px; height: 250px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.06;
  pointer-events: none;
}
.dream-card .card-glow { background: #A78BFA; }
.distill-card .card-glow { background: var(--cyan); }
</style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="scanline"></div>

<div class="corner corner-tl" data-el="corner-tl"></div>
<div class="corner corner-br" data-el="corner-br"></div>
<div class="light-dot light-dot-1" data-el="dot1"></div>
<div class="light-dot light-dot-2" data-el="dot2"></div>

<!-- Content -->
<div class="content">
  <div class="scene-title" data-el="title">Dream & Distill</div>

  <!-- Dual Cards -->
  <div class="dual-cards">
    <div class="dream-card" data-el="dream">
      <div class="card-glow"></div>
      <div class="card-header">
        <div class="card-icon-wrap">🌙</div>
        <div class="card-name">Dream</div>
      </div>
      <div class="card-flow">
        <div class="card-flow-step">
          <span>扫描历史会话</span>
          <span class="arrow">→</span>
        </div>
        <div class="card-flow-step">
          <span class="result">提取隐性知识</span>
        </div>
      </div>
    </div>

    <div class="distill-card" data-el="distill">
      <div class="card-glow"></div>
      <div class="card-header">
        <div class="card-icon-wrap">⚗️</div>
        <div class="card-name">Distill</div>
      </div>
      <div class="card-flow">
        <div class="card-flow-step">
          <span>识别重复工作</span>
          <span class="arrow">→</span>
        </div>
        <div class="card-flow-step">
          <span class="result">打包成可复用技能</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Section Divider -->
  <div class="section-divider" data-el="divider">
    <div class="line"></div>
    <div class="label">三种模式</div>
    <div class="line"></div>
  </div>

  <!-- Mode Tabs -->
  <div class="mode-tabs" data-el="modes">
    <div class="mode-tab" data-el="mode-build">
      <div class="mode-name">build</div>
      <div class="mode-desc">编码构建</div>
    </div>
    <div class="mode-tab" data-el="mode-plan">
      <div class="mode-name">plan</div>
      <div class="mode-desc">规划分析</div>
    </div>
    <div class="mode-tab active" data-el="mode-compose">
      <div class="mode-name">compose</div>
      <div class="mode-desc">从规格到交付</div>
    </div>
  </div>

  <!-- Compose Highlight -->
  <div class="compose-highlight" data-el="compose-hl">
    <div class="compose-text">
      <span class="glow">compose 模式</span><br>
      从规格到交付代码 · 一步到位
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";
  const clamp = (v, min=0, max=1) => Math.min(max, Math.max(min, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const progress = (time, start, dur) => clamp((time - start) / Math.max(dur, 0.0001));

  function reveal(el, time, opts) {
    const { start=0, duration=0.65, x=0, y=42, scale=0.96, blur=14 } = opts;
    const p = easeOutQuart(progress(time, start, duration));
    el.style.opacity = p;
    el.style.transform = `translate3d(${mix(x,0,p)}px, ${mix(y,0,p)}px, 0) scale(${mix(scale,1,p)})`;
    el.style.filter = `blur(${mix(blur,0,p)}px)`;
  }

  function seekTo(t) {
    // Title
    reveal(document.querySelector('[data-el="title"]'), t, { start: 0.2, duration: 0.6, y: 30, blur: 10 });

    // Dream & Distill cards
    reveal(document.querySelector('[data-el="dream"]'), t, { start: 0.8, duration: 0.7, y: 50, scale: 0.95, blur: 12 });
    reveal(document.querySelector('[data-el="distill"]'), t, { start: 1.1, duration: 0.7, y: 50, scale: 0.95, blur: 12 });

    // Divider
    reveal(document.querySelector('[data-el="divider"]'), t, { start: 2.0, duration: 0.4, y: 15, blur: 4 });

    // Mode tabs container
    reveal(document.querySelector('[data-el="modes"]'), t, { start: 2.4, duration: 0.5, y: 20, blur: 6 });

    // Individual mode tabs with stagger
    reveal(document.querySelector('[data-el="mode-build"]'), t, { start: 2.6, duration: 0.5, y: 30, scale: 0.9, blur: 8 });
    reveal(document.querySelector('[data-el="mode-plan"]'), t, { start: 2.9, duration: 0.5, y: 30, scale: 0.9, blur: 8 });
    reveal(document.querySelector('[data-el="mode-compose"]'), t, { start: 3.2, duration: 0.5, y: 30, scale: 0.9, blur: 8 });

    // Mode tab switching animation - highlight compose after others appear
    const modeBuild = document.querySelector('[data-el="mode-build"]');
    const modePlan = document.querySelector('[data-el="mode-plan"]');
    const modeCompose = document.querySelector('[data-el="mode-compose"]');

    if (t > 3.8) {
      modeBuild.classList.remove('active');
      modePlan.classList.remove('active');
      modeCompose.classList.add('active');
    } else if (t > 3.4) {
      modeBuild.classList.remove('active');
      modePlan.classList.add('active');
      modeCompose.classList.remove('active');
    } else if (t > 2.8) {
      modeBuild.classList.add('active');
      modePlan.classList.remove('active');
      modeCompose.classList.remove('active');
    }

    // Compose highlight
    reveal(document.querySelector('[data-el="compose-hl"]'), t, { start: 4.2, duration: 0.7, y: 30, blur: 10 });

    // Corners & dots
    document.querySelector('[data-el="corner-tl"]').style.opacity = easeOutQuart(progress(t, 0.3, 0.5));
    document.querySelector('[data-el="corner-br"]').style.opacity = easeOutQuart(progress(t, 0.5, 0.5));
    document.querySelector('[data-el="dot1"]').style.opacity = easeOutQuart(progress(t, 0.4, 0.5));
    document.querySelector('[data-el="dot2"]').style.opacity = easeOutQuart(progress(t, 0.6, 0.5));
  }

  window.seekTo = seekTo;
  window.__mode2Duration = 7;
  window.__mode2Ready = true;

  let startTime = performance.now();
  let autoRun = true;
  let _origSeekTo = seekTo;
  window.seekTo = function(t) {
    autoRun = false;
    _origSeekTo(t);
  };
  function animate() {
    if (!autoRun) return;
    const elapsed = (performance.now() - startTime) / 1000;
    _origSeekTo(Math.min(elapsed, 7));
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
